# mypy for first-party Python (AGENTS.md); tools/hooks/lint_code.py sets MYPYPATH to the Bazel import roots
# (tools/hooks/lint_files.py) and runs a second pass over tests with --allow-untyped-defs --allow-incomplete-defs.
# ignore_missing_imports: the generated *_pb2 modules and the Bazel-only packages (protobuf, rerun, zmq, jax) cannot be
# imported outside Bazel.
[mypy]
python_version = 3.11
explicit_package_bases = True
namespace_packages = True
ignore_missing_imports = True
follow_imports = silent
check_untyped_defs = True
disallow_incomplete_defs = True
disallow_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True
strict_equality = True
enable_error_code = ignore-without-code
cache_dir = .mypy_cache
