# cpplint for first-party C++ (the Google C++ Style Guide); tools/hooks/lint_code.py runs it over the first-party files.
set noparent
linelength=140
headers=h,hpp
extensions=h,hpp,cpp,cc
includeorder=standardcfirst
# Layout is clang-format's. cpplint's whitespace checks repeat it or disagree with it (whitespace/indent_namespace on
# continuation lines); only the empty-body checks are not layout. One line: cpplint applies the filter= lines of a file
# in reverse order, so a `+` on a later line than its `-` would lose.
filter=-whitespace,+whitespace/empty_loop_body,+whitespace/empty_if_body,+whitespace/empty_conditional_body
# clang-format (IncludeBlocks: Regroup) orders the includes, "pinocchio/fwd.hpp" first, which cpplint's order rejects.
filter=-build/include_order,-build/include_alpha
# cpplint accepts only TODO(user); the guide prefers `TODO: bug 123 - ...` (tools/hooks/todo_format.py checks both forms).
filter=-readability/todo
# The current guide prefers non-const references for outputs; cpplint's rule against them is obsolete.
filter=-runtime/references
# The guide's function length is advice, not a limit.
filter=-readability/fn_size
# <filesystem> is used on purpose: no Abseil equivalent exists (AGENTS.md, decision D3).
filter=-build/c++17
# SWEEP (generated from a cpplint run on the tree; deleted by WP-E. Each category leaves with the change that fixes its
# last finding: python3 -m tools.hooks.lint_code --only cpplint shows them once the line is gone):
filter=-build/include_what_you_use,-runtime/int,-readability/braces,-build/namespaces,-runtime/explicit
filter=-build/include,-runtime/string,-readability/inheritance,-readability/casting,-legal/copyright
filter=-runtime/arrays,-build/storage_class,-build/header_guard
