edition = "2023";

package humanoid_mpc_config;

import "nproto/options.proto";

// The eighteen weights of a task-space cost, one per axis of the tracked frame: the position, orientation, linear and
// angular velocity, and linear and angular acceleration errors. An absent weight is 0. The centroidal MPC's kinematic
// costs weigh the first twelve (EndEffectorKinematicsWeights) and refuse a non-zero acceleration weight, which they
// have no term for; the whole-body MPC's foot cost weighs all eighteen (EndEffectorDynamicsWeights).
// Next ID: 19
message TaskSpaceWeights {
  option (nproto.generate_struct) = "ocs2::humanoid::mpc_config::TaskSpaceWeights";

  reserved 19 to max;

  double pos_x = 1 [default = 0.0];
  double pos_y = 2 [default = 0.0];
  double pos_z = 3 [default = 0.0];
  double orientation_x = 4 [default = 0.0];
  double orientation_y = 5 [default = 0.0];
  double orientation_z = 6 [default = 0.0];
  double lin_velocity_x = 7 [default = 0.0];
  double lin_velocity_y = 8 [default = 0.0];
  double lin_velocity_z = 9 [default = 0.0];
  double ang_velocity_x = 10 [default = 0.0];
  double ang_velocity_y = 11 [default = 0.0];
  double ang_velocity_z = 12 [default = 0.0];
  double lin_acceleration_x = 13 [default = 0.0];
  double lin_acceleration_y = 14 [default = 0.0];
  double lin_acceleration_z = 15 [default = 0.0];
  double ang_acceleration_x = 16 [default = 0.0];
  double ang_acceleration_y = 17 [default = 0.0];
  double ang_acceleration_z = 18 [default = 0.0];
}
