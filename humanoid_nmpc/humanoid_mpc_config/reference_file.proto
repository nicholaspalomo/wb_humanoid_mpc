edition = "2023";

package humanoid_mpc_config;

import "humanoid_mpc_config/config_options.proto";
import "humanoid_mpc_config/joint_value.proto";
import "humanoid_mpc_config/mode_schedule_config.proto";
import "humanoid_mpc_config/mode_sequence_template_config.proto";
import "nproto/options.proto";

// A robot's command reference file, config/command/reference.textproto: the operator's command limits, the shaping of
// the velocity command, the default posture and the gait schedule's start.
// The target trajectories calculators, the procedural motion manager, the gait schedule, the keyboard teleoperation and
// the validation driver read it through the conversions of humanoid_common_mpc/config/reference/ (ReferenceFromConfig.h,
// GaitFromConfig.h) and teleop's KeyboardCommandLimitsFromConfig.h.
//
// The values the MPC cannot do without have no default (a std::optional of the struct): the conversions refuse a file
// that leaves one out. Every number is finite.
// Next ID: 15
message ReferenceFile {
  option (nproto.generate_struct) = "ocs2::humanoid::mpc_config::ReferenceFile";

  reserved 15 to max;

  // [m/s] The speed a base pose command travels at: the time to reach the target is the distance over it. Required.
  double target_displacement_velocity = 1 [(humanoid_mpc_config.tuning) = { reload: RELOAD_HOT unit: "m/s" }];
  // [rad/s] The yaw rate a base pose command turns at. Required.
  double target_rotation_velocity = 2 [(humanoid_mpc_config.tuning) = { reload: RELOAD_HOT unit: "rad/s" }];
  // [m/s] The forward and the sideways velocity of a full stick deflection: the MPC scales the operator's normalized
  // walking command by them, and the keyboard teleoperation normalizes its command by them. Required.
  // LINT.IfChange(derive_parameters_command_limits)
  double max_displacement_velocity_x = 3 [(humanoid_mpc_config.tuning) = { reload: RELOAD_HOT unit: "m/s" }];
  double max_displacement_velocity_y = 4 [(humanoid_mpc_config.tuning) = { reload: RELOAD_HOT unit: "m/s" }];
  // [m] The largest change of the base height a command may ask for, either way of default_base_height. Required.
  double max_delta_pelvis_height = 5 [(humanoid_mpc_config.tuning) = { reload: RELOAD_HOT unit: "m" }];
  // [rad/s] The yaw rate of a full stick deflection. Required.
  double max_rotation_velocity = 6 [(humanoid_mpc_config.tuning) = { reload: RELOAD_HOT unit: "rad/s" }];
  // LINT.ThenChange(//tools/locomotion_heuristics/derive_parameters.py:derive_parameters_inputs)
  // [m/s^2], [rad/s^2] The acceleration limits of the velocity reference the MPC target and the contact planner follow,
  // the linear one in the (x, y) plane; 0 turns a ramp off, an unramped reference.
  double max_linear_acceleration = 7 [
    default = 0.0,
    (humanoid_mpc_config.tuning) = {
      reload: RELOAD_HOT
      unit: "m/s^2"
    }
  ];
  double max_angular_acceleration = 8 [
    default = 0.0,
    (humanoid_mpc_config.tuning) = {
      reload: RELOAD_HOT
      unit: "rad/s^2"
    }
  ];
  // [Hz] The break frequency of the first-order low-pass filter on the operator's velocity command, >= 0; 0 turns the
  // filter off and the command passes through unchanged.
  // LINT.IfChange(velocity_command_filter_break_frequency)
  double velocity_command_filter_break_frequency = 9 [
    default = 0.0,
    (humanoid_mpc_config.tuning) = {
      reload: RELOAD_HOT
      unit: "Hz"
    }
  ];
  // LINT.ThenChange(//humanoid_nmpc/humanoid_common_mpc/src/config/reference/ReferenceFromConfig.cpp:hot_reference_file_fields)
  // [s] The time constant with which the centroidal MPC's joint reference approaches the target joint state. Required
  // by the centroidal MPC; the whole-body MPC does not read it.
  double target_joint_state_interpolation_time_constant = 10 [
    (humanoid_mpc_config.tuning) = {
      reload: RELOAD_START_UP
      unit: "s"
    }
  ];
  // [m] The base height above the ground of the default posture, which a command without a pelvis height asks for.
  // Required.
  // LINT.IfChange(derive_parameters_base_height)
  double default_base_height = 11 [(humanoid_mpc_config.tuning) = { reload: RELOAD_HOT unit: "m" }];
  // LINT.ThenChange(//tools/locomotion_heuristics/derive_parameters.py:derive_parameters_inputs)
  // [rad] The joint positions of the default posture, by joint name (formerly defaultJointState by index): every joint
  // of the MPC model exactly once, in any order; a fixed joint or a name the model does not have is refused.
  repeated JointValue default_joint_state = 12 [(humanoid_mpc_config.tuning) = { reload: RELOAD_START_UP unit: "rad" }];
  // The mode schedule the gait schedule starts from: at least two modes, since the gait schedule replaces the stance it
  // ends in by the gait from its last event time on.
  ModeScheduleConfig initial_mode_schedule = 13 [
    (humanoid_mpc_config.tuning) = {
      reload: RELOAD_START_UP
      exclude_reason: "the gait the MPC starts with: its times go with its modes, which the GUI does not edit"
    }
  ];
  // The gait the gait schedule repeats until the motion manager inserts another; it has no name.
  ModeSequenceTemplateConfig default_mode_sequence_template = 14 [
    (humanoid_mpc_config.tuning) = {
      reload: RELOAD_START_UP
      exclude_reason: "the gait the MPC starts with: its times go with its modes, which the GUI does not edit"
    }
  ];
}
