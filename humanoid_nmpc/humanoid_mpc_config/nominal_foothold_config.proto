edition = "2023";

package humanoid_mpc_config;

import "humanoid_mpc_config/config_options.proto";
import "nproto/options.proto";

// The nominal foothold reference (the task file's nominal_foothold block, ModelSettings::NominalFootholdConfig), used
// only under contact_schedule_source "gait_schedule": the horizontal target of a swing foot when no contact planner
// supplies one. It is a foot placement heuristic, and off by default.
// Next ID: 3
message NominalFootholdConfig {
  option (nproto.generate_struct) = "ocs2::humanoid::mpc_config::NominalFootholdConfig";

  reserved 3 to max;

  // [m] The full lateral distance between the feet: each foot is placed this far to its own side of the stance foot.
  // 0 disables the nominal reference.
  // LINT.IfChange(derive_parameters_step_width)
  double nom_pos_lfoot_rt_rfoot_ewrt_heading_y = 1 [default = 0.0, (humanoid_mpc_config.tuning) = { unit: "m" }];
  // LINT.ThenChange(//tools/locomotion_heuristics/derive_parameters.py:derive_parameters_inputs)
  // What the landing target is measured from, by name. "step_width" (the biped's): the nominal step lands a foot
  // nom_pos_lfoot_rt_rfoot_ewrt_heading_y to its side of the stance foot, and the foothold heuristics start from half
  // of it to each side of the predicted base; the centroidal MPC refuses it with a positive width on any set but the
  // biped's. "nominal_stance": each swing contact lands where it stands at the nominal posture relative to the base
  // predicted at its touch-down, turned by the predicted yaw (for a quadruped, below its hip); it needs
  // model_settings.legs to cover every contact, and a biped may opt in.
  // LINT.IfChange(nominal_foothold_anchor)
  string anchor = 2 [
    default = "step_width",
    (humanoid_mpc_config.tuning) = {
      registry: "nominal_foothold_anchor"
    }
  ];
  // LINT.ThenChange(//humanoid_nmpc/humanoid_common_mpc/src/config/model/ModelSettingsFromConfig.cpp:nominal_foothold_anchor_names)
}
