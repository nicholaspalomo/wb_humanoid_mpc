edition = "2023";

package humanoid_mpc_config;

import "humanoid_mpc_config/joint_pd_gains_file.proto";
import "nproto/options.proto";

// The tuning GUI's live joint PD gains on operator/pd_gains: the whole gains file, paired with the configuration identity
// and schema fingerprint of the sender so that another robot or configuration's live gains are refused.
// Next ID: 4
message JointPdGainsUpdate {
  option (nproto.generate_struct) = "ocs2::humanoid::mpc_config::JointPdGainsUpdate";

  reserved 4 to max;

  JointPdGainsFile gains = 1;
  // The joint PD gains file's path from its last robot_models/ component on, e.g.
  // "robot_models/unitree_g1/g1_wb_mpc/config/controller/joint_pd_gains.textproto".
  string config_path = 2 [default = ""];
  // The schema fingerprint of JointPdGainsFile in the sender's build (nproto::SchemaFingerprint(), the Python
  // nproto_schema.schema_fingerprint()).
  string schema_fingerprint = 3 [default = ""];
}
