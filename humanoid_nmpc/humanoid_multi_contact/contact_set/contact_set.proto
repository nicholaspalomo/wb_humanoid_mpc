edition = "2023";

package humanoid_multi_contact;

import "nproto/options.proto";

// The contact candidates of a robot for multi-contact planning (humanoid_nmpc/docs/multi_contact_planning/README.md,
// section 3.1): every place of the body that may touch the terrain, in the order that numbers the bits of a contact
// mode (bit i: candidate i is active). At most 64 candidates.
// Next ID: 3
message ContactSet {
  option (nproto.generate_struct) = "ocs2::humanoid::multi_contact::config::ContactSet";

  reserved 3 to max;

  // How a candidate transmits load.
  enum Kind {
    KIND_UNSPECIFIED = 0;
    // A 3-DoF contact: a force at one point, in a friction cone (a knee, a hand, a forearm, a thigh).
    KIND_POINT = 1;
    // A 6-DoF contact: a wrench of a rectangular pad, in the pad's contact wrench cone (a foot, the seat, the torso).
    KIND_SURFACE = 2;
  }

  // [m] A surface candidate's pad in its pad frame (Candidate), with x_min < x_max and y_min < y_max.
  // Next ID: 5
  message Rectangle {
    reserved 5 to max;

    double x_min = 1 [default = 0.0];
    double x_max = 2 [default = 0.0];
    double y_min = 3 [default = 0.0];
    double y_max = 4 [default = 0.0];
  }

  // One candidate. Its pad frame, in the parent joint's frame, has its origin at `offset`, its z axis along
  // -pad_normal (into the body, so that it is the terrain's normal when the pad rests on a surface) and its x axis
  // along `pad_x_axis`.
  // Next ID: 9
  message Candidate {
    reserved 9 to max;

    // Unique within the set.
    string name = 1 [default = ""];
    Kind kind = 2;
    // The joint of the robot's URDF whose frame the pad is fixed to; "root_joint" is the floating base (Pinocchio's
    // name of the root joint, whose frame is the base link's).
    string parent_joint = 3 [default = ""];
    // [m] The pad's center in the parent joint's frame: x, y, z. On a round geometry it lies on the surface, at
    // geom_radius from the geometry's axis or center along pad_normal.
    repeated double offset = 4;
    // The outward unit normal of the pad in the parent joint's frame: x, y, z.
    repeated double pad_normal = 5;
    // A unit vector orthogonal to pad_normal, in the parent joint's frame: the x axis of the pad frame. Required for a
    // surface candidate, whose rectangle it orients; empty for a point candidate: any vector orthogonal to the normal.
    repeated double pad_x_axis = 6;
    // [m] The radius of the collision geometry the pad sits on; 0 for a flat pad.
    double geom_radius = 7 [default = 0.0];
    // Required for a surface candidate, and refused for a point candidate.
    Rectangle rectangle = 8 [(nproto.optional_message) = true];
  }

  // The robot the set belongs to, for messages.
  string robot = 1 [default = ""];
  // At least one, at most 64.
  repeated Candidate candidates = 2;
}
