syntax = "proto3";

package humanoid_mpc_msgs;

import "nproto/options.proto";

// Topic operator/walking_velocity_command; read by the MPC (motion manager) and, in simulation, by the gantry.
// Next ID: 5
message WalkingVelocityCommand {
  option (nproto.generate_struct) = "ocs2::humanoid::msgs::WalkingVelocityCommand";

  reserved 5 to max;

  // Normalized to [-1, 1]; the MPC scales them by the limits in reference.textproto.
  double cmd_linvel_base_rt_world_ewrt_heading_x = 1;
  double cmd_linvel_base_rt_world_ewrt_heading_y = 2;
  // Absolute height of the pelvis above the ground [m].
  double cmd_pos_base_rt_world_ewrt_world_z = 3;
  // Normalized to [-1, 1].
  double cmd_angvel_base_rt_world_ewrt_world_z = 4;
}
