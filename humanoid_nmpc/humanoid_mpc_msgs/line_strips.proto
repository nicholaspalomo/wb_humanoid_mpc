syntax = "proto3";

package humanoid_mpc_msgs;

import "humanoid_mpc_msgs/line_strip.proto";
import "nproto/options.proto";

// Polylines (Rerun LineStrips3D).
// Next ID: 4
message LineStrips {
  option (nproto.generate_struct) = "ocs2::humanoid::msgs::LineStrips";

  reserved 4 to max;

  string path = 1;
  repeated LineStrip strips = 2;
  float radius = 3;
}
