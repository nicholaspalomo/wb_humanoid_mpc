syntax = "proto3";

package humanoid_mpc_msgs;

import "nproto/options.proto";

// Topic robot/loop_timing, once per second: how well the realtime loop held its period.
// Next ID: 12
message LoopTiming {
  option (nproto.generate_struct) = "ocs2::humanoid::msgs::LoopTiming";

  reserved 12 to max;

  double target_period_s = 1;
  // Cycles since the loop started.
  uint64 cycles = 2;
  // Over the last reporting interval.
  double mean_period_s = 3;
  double max_period_s = 4;
  double max_compute_time_s = 5;
  // Cycles whose compute time exceeded the period, since the loop started (a total, as every counter of this message).
  uint64 overruns = 6;
  // Telemetry samples the realtime thread dropped because the ring buffer was full, since the loop started.
  uint64 telemetry_samples_dropped = 7;
  // Policies received from the MPC and dropped as solved before a reset the robot requested, since the loop started.
  uint64 stale_policies_dropped = 8;
  // Age of the newest policy the MPC link accepted at the end of the interval [s], robot clock: in WB_MPC the policy in
  // use or the one swapped in at the next cycle; in the passive modes, where no policy is executed, the one WB_MPC would
  // start from. Negative before the first accepted policy and after a clock rewind until the first policy of the new
  // clock.
  double policy_age_s = 9;
  // Control periods the loop skipped since it started: deadlines that passed before the cycle for them could run (a
  // late wake-up or a long cycle; the timer skips them rather than replay them). `overruns` counts only compute time
  // above the period, so a loop that loses periods to late wake-ups shows here and not there.
  uint64 missed_periods = 10;
  // The latest wake-up past its deadline over the last reporting interval [s]: scheduler latency, a lock, a blocked
  // write on the realtime thread.
  double max_lateness_s = 11;
}
