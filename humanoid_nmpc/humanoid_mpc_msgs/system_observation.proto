syntax = "proto3";

package humanoid_mpc_msgs;

import "nproto/options.proto";

// ocs2::SystemObservation.
// Next ID: 5
message SystemObservation {
  option (nproto.generate_struct) = "ocs2::humanoid::msgs::SystemObservation";

  reserved 5 to max;

  double time = 1;
  repeated double state = 2;
  repeated double input = 3;
  uint64 mode = 4;
}
