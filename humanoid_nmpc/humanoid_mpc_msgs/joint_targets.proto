syntax = "proto3";

package humanoid_mpc_msgs;

import "nproto/options.proto";

// Topic operator/joint_targets: the nominal posture of JOINT_PD, by joint name [rad]. Joints not named keep their
// target; unknown names are ignored.
// Next ID: 2
message JointTargets {
  option (nproto.generate_struct) = "ocs2::humanoid::msgs::JointTargets";

  reserved 2 to max;

  map<string, double> positions = 1;
}
