name: Full Install & Build Tests

on:
  push:
    branches:
      - main
      - user/**
  pull_request:
    branches: 
      - '**'
    types: [opened, synchronize, reopened]
  merge_group:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      matrix:
        container:
          - "ros:jazzy"
    container: ${{ matrix.container }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # LINT.IfChange(system_dependencies)
      - name: Install Base Dependencies & Tools
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
          curl gnupg2 lsb-release software-properties-common \
          locales git gettext-base sudo wget build-essential
      # LINT.ThenChange(//dependencies.txt:system_dependencies, //docker/Dockerfile:system_dependencies)

      - name: Install Bazel (via Bazelisk)
        run: |
          curl -sSL -o /usr/local/bin/bazel https://github.com/bazelbuild/bazelisk/releases/latest/download/bazelisk-linux-amd64
          chmod +x /usr/local/bin/bazel
          bazel --version

      - name: Install Project Dependencies
        run: |
          envsubst < dependencies.txt | xargs apt-get install -y --no-install-recommends

      - name: Configure Git Safe Directory
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Cache Bazel Downloads and Build Artifacts
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/bazel
          key: ${{ runner.os }}-bazel-${{ hashFiles('MODULE.bazel', '**/BUILD.bazel') }}
          restore-keys: |
            ${{ runner.os }}-bazel-

      - name: Build All (Bazel Monorepo)
        run: |
          make build-all

      - name: Run All Tests (Bazel Monorepo)
        run: |
          make test-all