name: Code Format Check

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  format-check:
    # The formatters the dev container and its pre-commit hook run, not whatever is newest: a newer clang-format or
    # black formats differently, and CI would then reject code the hook had just formatted. Ubuntu 24.04 is what
    # provides clang-format 18 (ubuntu-latest moves to a newer Ubuntu), and black is the version Ubuntu 24.04 packages.
    # LINT.IfChange(formatter_versions)
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install Python formatters and lint tools
      run: |
        python -m pip install --upgrade pip
        pip install black==24.2.0
        pip install --require-hashes -r tools/hooks/lint_requirements_lock.txt

    - name: Install clang-format
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-format-18
        sudo ln -sf /usr/bin/clang-format-18 /usr/local/bin/clang-format
    # LINT.ThenChange(//docker/Dockerfile:clang_format_version, //dependencies.txt:system_dependencies)

    - name: Check clang-format version
      run: clang-format --version

    - name: Check Black version
      run: black --version

    - name: Check git status before formatting
      run: git status --porcelain

    - name: Run make format
      run: make format

    - name: Check for formatting changes
      id: format-check
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "changes=true" >> $GITHUB_OUTPUT
          echo "❌ Files were modified by 'make format'"
          echo ""
          echo "Modified files:"
          git status --porcelain
          echo ""
          echo "Diff:"
          git diff
        else
          echo "changes=false" >> $GITHUB_OUTPUT
          echo "✅ No formatting changes needed"
        fi

    # The repository's linter (make lint): IFTTT directives, whitespace, clang-format, black, the token checks of
    # tools/hooks/checks.py, cpplint, pylint and mypy. Run after `make format`, so a failure here is a rule the formatter
    # cannot fix. GitHub sets CI=true, so a lint tool missing from the lock's install is an error here.
    - name: Run linter
      id: lint
      run: python3 -m tools.hooks.lint_code

    - name: Display formatting instructions
      if: steps.format-check.outputs.changes == 'true'
      run: |
        echo "❌ Code formatting check failed!"
        echo ""
        echo "To fix all formatting issues, run:"
        echo ""
        echo "  make format"
        echo ""
        echo "Then commit and push your changes."

    - name: Fail if formatting issues found
      if: steps.format-check.outputs.changes == 'true'
      run: |
        echo "Code formatting issues detected. Please run 'make format' to fix them."
        exit 1
