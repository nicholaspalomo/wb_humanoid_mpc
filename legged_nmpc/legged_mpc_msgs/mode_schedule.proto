syntax = "proto3";

package legged_mpc_msgs;

import "nproto/options.proto";

// The package before the humanoid -> legged rename, which the header of a file saved before it gives.
option (nproto.former_package) = "humanoid_mpc_msgs";

// ocs2::ModeSchedule.
// Next ID: 3
message ModeSchedule {
  option (nproto.generate_struct) = "ocs2::legged::msgs::ModeSchedule";

  reserved 3 to max;

  repeated double event_times = 1;
  repeated uint64 mode_sequence = 2;
}
