syntax = "proto3";

package legged_mpc_msgs;

import "legged_mpc_msgs/color.proto";
import "legged_mpc_msgs/vector3.proto";
import "nproto/options.proto";

// The package before the humanoid -> legged rename, which the header of a file saved before it gives.
option (nproto.former_package) = "humanoid_mpc_msgs";

// Spheres (Rerun Points3D with radii).
// Next ID: 5
message Spheres {
  option (nproto.generate_struct) = "ocs2::legged::msgs::Spheres";

  reserved 5 to max;

  string path = 1;
  repeated Vector3 pos_spheres_rt_world_ewrt_world = 2;
  // One radius for all, or one per sphere.
  repeated float radii = 3;
  repeated Color colors = 4;
}
