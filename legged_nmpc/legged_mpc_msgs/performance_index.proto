syntax = "proto3";

package legged_mpc_msgs;

import "nproto/options.proto";

// The package before the humanoid -> legged rename, which the header of a file saved before it gives.
option (nproto.former_package) = "humanoid_mpc_msgs";

// ocs2::PerformanceIndex.
// Next ID: 9
message PerformanceIndex {
  option (nproto.generate_struct) = "ocs2::legged::msgs::PerformanceIndex";

  reserved 9 to max;

  double merit = 1;
  double cost = 2;
  double dual_feasibilities_sse = 3;
  double dynamics_violation_sse = 4;
  double equality_constraints_sse = 5;
  double inequality_constraints_sse = 6;
  double equality_lagrangian = 7;
  double inequality_lagrangian = 8;
}
