syntax = "proto3";

package legged_mpc_msgs;

import "nproto/options.proto";

// The package before the humanoid -> legged rename, which the header of a file saved before it gives.
option (nproto.former_package) = "humanoid_mpc_msgs";

// Topic operator/walking_velocity_command; read by the MPC (motion manager) and, in simulation, by the gantry.
// Next ID: 5
message WalkingVelocityCommand {
  option (nproto.generate_struct) = "ocs2::legged::msgs::WalkingVelocityCommand";

  reserved 5 to max;

  // Divided by the limits (the lnorm qualifier): in [-1, 1], and the MPC scales them by the limits
  // cmd_max_linvel_base_rt_world_ewrt_heading_x / _y of reference.textproto.
  double cmd_lnorm_linvel_base_rt_world_ewrt_heading_x = 1;
  double cmd_lnorm_linvel_base_rt_world_ewrt_heading_y = 2;
  // Absolute height of the pelvis above the ground [m].
  double cmd_pos_base_rt_surface_ewrt_world_z = 3;
  // Divided by the limit cmd_max_angvel_base_rt_world_ewrt_world_z of reference.textproto: in [-1, 1].
  double cmd_lnorm_angvel_base_rt_world_ewrt_world_z = 4;
}
