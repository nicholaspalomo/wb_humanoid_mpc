syntax = "proto3";

package legged_mpc_msgs;

import "nproto/options.proto";

// The package before the humanoid -> legged rename, which the header of a file saved before it gives.
option (nproto.former_package) = "humanoid_mpc_msgs";

// ocs2::SystemObservation.
// Next ID: 5
message SystemObservation {
  option (nproto.generate_struct) = "ocs2::legged::msgs::SystemObservation";

  reserved 5 to max;

  double time = 1;
  repeated double state = 2;
  repeated double input = 3;
  uint64 mode = 4;
}
