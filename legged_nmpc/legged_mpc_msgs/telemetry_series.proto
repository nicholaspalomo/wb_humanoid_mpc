syntax = "proto3";

package legged_mpc_msgs;

import "legged_mpc_msgs/scalar_group.proto";
import "nproto/options.proto";

// The package before the humanoid -> legged rename, which the header of a file saved before it gives.
option (nproto.former_package) = "humanoid_mpc_msgs";

// Topic viz/telemetry: the plots, one message per robot/state sample.
// Next ID: 3
message TelemetrySeries {
  option (nproto.generate_struct) = "ocs2::legged::msgs::TelemetrySeries";

  reserved 3 to max;

  // Robot clock [s].
  double time = 1;
  repeated ScalarGroup groups = 2;
}
