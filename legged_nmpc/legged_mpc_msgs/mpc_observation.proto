syntax = "proto3";

package legged_mpc_msgs;

import "legged_mpc_msgs/reset_requests.proto";
import "legged_mpc_msgs/system_observation.proto";
import "nproto/options.proto";

// The package before the humanoid -> legged rename, which the header of a file saved before it gives.
option (nproto.former_package) = "humanoid_mpc_msgs";

// Next ID: 5
message MpcObservation {
  option (nproto.generate_struct) = "ocs2::legged::msgs::MpcObservation";

  reserved 5 to max;

  SystemObservation observation = 1;
  ResetRequests resets = 2;
  // Control cycles since the robot process started; lets the MPC side count lost observations.
  uint64 sequence = 3;
  // The robot model's layout the observation is of (modelLayoutFingerprint(), legged_common_mpc/common/ModelSettings.h):
  // the robot, the state layout and the order of the MPC model's joints and contacts. An MPC node of another layout
  // refuses it, as one of other dimensions. 0: not stamped.
  fixed64 model_fingerprint = 4;
}
