syntax = "proto3";

package legged_mpc_msgs;

import "nproto/options.proto";

// The package before the humanoid -> legged rename, which the header of a file saved before it gives.
option (nproto.former_package) = "humanoid_mpc_msgs";

// Unit quaternion, Hamilton convention (Eigen::Quaterniond).
// Next ID: 5
message Quaternion {
  option (nproto.generate_struct) = "ocs2::legged::msgs::Quaternion";

  reserved 5 to max;

  double w = 1;
  double x = 2;
  double y = 3;
  double z = 4;
}
