syntax = "proto3";

package legged_mpc_msgs;

import "nproto/options.proto";

// The package before the humanoid -> legged rename, which the header of a file saved before it gives.
option (nproto.former_package) = "humanoid_mpc_msgs";

// Topic operator/joint_targets: the nominal posture of JOINT_PD, by joint name [rad]. Joints not named keep their
// target; unknown names are ignored.
// Next ID: 2
message JointTargets {
  option (nproto.generate_struct) = "ocs2::legged::msgs::JointTargets";

  reserved 2 to max;

  map<string, double> joint_positions = 1;
}
