syntax = "proto3";

package legged_mpc_msgs;

import "legged_mpc_msgs/pose.proto";
import "nproto/options.proto";

// The package before the humanoid -> legged rename, which the header of a file saved before it gives.
option (nproto.former_package) = "humanoid_mpc_msgs";

// One copy of the robot model: the world pose of every URDF link the model knows. The bridge loads the URDF's meshes
// once per instance name and moves them with these poses.
// Next ID: 4
message RobotModelInstance {
  option (nproto.generate_struct) = "ocs2::legged::msgs::RobotModelInstance";

  reserved 4 to max;

  // "measured", "terminal_state" (the last node of the MPC plan) or "terminal_target" (the reference at that time).
  string name = 1;
  repeated string link_names = 2;
  repeated Pose pose_links_rt_world = 3;
}
