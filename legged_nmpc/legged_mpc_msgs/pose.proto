syntax = "proto3";

package legged_mpc_msgs;

import "legged_mpc_msgs/quaternion.proto";
import "legged_mpc_msgs/vector3.proto";
import "nproto/options.proto";

// The package before the humanoid -> legged rename, which the header of a file saved before it gives.
option (nproto.former_package) = "humanoid_mpc_msgs";

// Next ID: 3
message Pose {
  option (nproto.generate_struct) = "ocs2::legged::msgs::Pose";

  reserved 3 to max;

  Vector3 position = 1;  // NOLINT(frame-naming): a component of a frame-generic value; the enclosing field names the frames
  Quaternion orientation = 2;  // NOLINT(frame-naming): a component of a frame-generic value; the enclosing field names the frames
}
