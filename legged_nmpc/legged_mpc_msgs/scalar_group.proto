syntax = "proto3";

package legged_mpc_msgs;

import "nproto/options.proto";

// The package before the humanoid -> legged rename, which the header of a file saved before it gives.
option (nproto.former_package) = "humanoid_mpc_msgs";

// Named scalars plotted together: one Rerun entity with one series per name.
// Next ID: 4
message ScalarGroup {
  option (nproto.generate_struct) = "ocs2::legged::msgs::ScalarGroup";

  reserved 4 to max;

  string path = 1;
  repeated string names = 2;
  repeated double values = 3;
}
