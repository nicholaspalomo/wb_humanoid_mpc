edition = "2023";

package legged_mpc_config;

import "legged_mpc_config/config_options.proto";
import "legged_mpc_config/xyz.proto";
import "nproto/options.proto";
import "nproto/retired_field_options.proto";

// The package before the humanoid -> legged rename, which the header of a file saved before it gives.
option (nproto.former_package) = "humanoid_mpc_config";

// The robot model the MPC is formulated on (the task file's model_settings block, ModelSettings): the robot's name, the
// gains of the foot constraints, the CppAD flags, the joints the MPC leaves out, the 6-DoF contacts and the joints they
// are attached to, the 3-DoF contacts, the rolling contacts of the wheels, the legs, and the joints of the procedural arm
// swing. Joints and contacts are URDF and Pinocchio names; ModelSettings::Create() reads the rest of the model, the
// joints and their order, off the URDF.
// Next ID: 13
message ModelSettingsConfig {
  option (nproto.generate_struct) = "ocs2::legged::mpc_config::ModelSettingsConfig";
  // The folder used to be a key that nothing read; the old loader warned about it.
  option (nproto.retired_field) = {
    name: "model_folder_cpp_ad"
    replacement: "the CppAD libraries are built under cppad_code_gen/cppad_<mpc><robot_name>, derived from the robot (the centroidal MPC adds a sub-folder per contact input parameterization); delete the key"
  };

  reserved 13 to max;

  // The gains of the swing- and stance-foot constraints, the weights of their soft forms and the rows of the stance
  // constraint (ModelSettings::FootConstraintConfig).
  // Next ID: 14
  message FootConstraintConfig {
    option (nproto.retired_field) = {
      name: "constrain_orientation"
      replacement: "the rows of the stance constraint are selected by name: stance_constraint: \"position\" where it was false, \"position_and_tilt\" where it was true, \"position_and_orientation\" where constrain_yaw_rate_about_contact_normal was true as well"
    };
    option (nproto.retired_field) = {
      name: "constrain_yaw_rate_about_contact_normal"
      replacement: "the rows of the stance constraint are selected by name: stance_constraint: \"position_and_orientation\" where it was true (with constrain_orientation true), \"position_and_tilt\" where it was false"
    };

    reserved 14 to max;
    // 11 and 12 were constrain_orientation and constrain_yaw_rate_about_contact_normal, now the name stance_constraint.
    reserved 11, 12;

    // [1/s] The swing foot's vertical servo of the normal_velocity constraint,
    // v_z = zdot_ref + position_error_gain_z * (z_ref - z).
    double position_error_gain_z = 1 [default = 1.0, (legged_mpc_config.tuning) = { unit: "1/s" }];
    // The gains of the stance foot's zero_velocity constraint: orientation, velocity and acceleration errors. The
    // angular velocity and acceleration gains multiply the rate and the acceleration of the orientation error (the sine
    // of half the foot's tilt), not the foot's angular velocity and acceleration: at a level foot the rate is half the
    // angular velocity (on the centroidal MPC under position_and_tilt, half its part perpendicular to the ground
    // normal), and the whole body's acceleration is half the angular acceleration but for (n.w)(n x w) / 2, which is
    // zero at rest (legged_nmpc/docs/quaternion_base_orientation/README.md, section 2.8.6).
    double orientation_error_gain = 2 [default = 1.0];
    double linear_velocity_error_gain_z = 3 [default = 1.0];
    double linear_velocity_error_gain_xy = 4 [default = 1.0];
    double angular_velocity_error_gain = 5 [default = 1.0];
    // The acceleration-error gains: the whole-body MPC's, whose foot constraints act on the foot's acceleration.
    double linear_acceleration_error_gain_z = 6 [default = 1.0, (legged_mpc_config.tuning) = { formulations: "whole_body" }];
    double linear_acceleration_error_gain_xy = 7 [default = 1.0, (legged_mpc_config.tuning) = { formulations: "whole_body" }];
    double angular_acceleration_error_gain = 8 [default = 1.0, (legged_mpc_config.tuning) = { formulations: "whole_body" }];
    // The weight of the soft zero_velocity term, when soft_constraints lists it.
    double soft_constraint_weight = 9 [default = 10.0];
    // The weight of the soft normal_velocity term, when soft_constraints lists it: the swing-foot vertical servo
    // priced instead of imposed.
    double normal_velocity_soft_constraint_weight = 10 [default = 500.0];
    // What the stance foot's zero_velocity constraint holds, by name: "position" (3-D: the foot may tilt and pivot),
    // "position_and_tilt" (6-D, whose orientation rows see the foot's tilt only: it may pivot about the contact normal)
    // or "position_and_orientation" (6-D with the yaw rate about the contact normal: a stance foot cannot pivot on the
    // spot, which removes one input degree of freedom per stance foot).
    // The centroidal MPC's; the whole-body MPC's stance constraint always holds all six rows.
    // LINT.IfChange(stance_constraint)
    string stance_constraint = 13 [
      default = "position_and_tilt",
      (legged_mpc_config.tuning) = {
        registry: "stance_constraint"
        formulations: "centroidal"
      }
    ];
    // LINT.ThenChange(//legged_nmpc/legged_common_mpc/include/legged_common_mpc/config/model/ModelSettingsFromConfig.h:stance_constraint_names)
  }

  // The four joints the procedural arm swing drives, by URDF name: all four, or none. A legs-only robot leaves the
  // block out, which disables the arm swing; a name that is not an active joint of the MPC model is refused.
  // Next ID: 5
  message ArmJointNames {
    reserved 5 to max;

    string left_shoulder_y = 1 [default = ""];
    string right_shoulder_y = 2 [default = ""];
    string left_elbow_y = 3 [default = ""];
    string right_elbow_y = 4 [default = ""];
  }

  // The robot, by the name the ACoM network registry dispatches on (AngularCenterOfMass.cpp); it also names the CppAD
  // library folder.
  string robot_name = 1 [default = ""];
  FootConstraintConfig foot_constraint = 2 [(legged_mpc_config.tuning) = { reload: RELOAD_HOT }];
  // [s]
  double phase_transition_stance_time = 3 [default = 0.0, (legged_mpc_config.tuning) = { unit: "s" }];
  // Whether CppAD reports what it compiles, and whether it compiles the model libraries again although they exist.
  bool verbose_cpp_ad = 4 [
    default = true,
    (legged_mpc_config.tuning) = {
      exclude_reason: "a log switch of the CppAD code generation, not a tuning parameter"
    }
  ];
  bool recompile_libraries_cpp_ad = 5 [
    default = true,
    (legged_mpc_config.tuning) = {
      exclude_reason: "a build switch of the CppAD code generation, not a tuning parameter"
    }
  ];
  // The URDF joints the MPC model leaves out; absent: none.
  repeated string fixed_joint_names = 6 [
    (legged_mpc_config.tuning) = {
      exclude_reason: "the joints of the MPC model: they fix the problem's dimensions"
    }
  ];
  // The Pinocchio frames of the 6-DoF contacts (formerly contactNames6DoF).
  repeated string contact_names_6dof = 7 [
    (legged_mpc_config.tuning) = {
      exclude_reason: "frame names of the robot model"
    }
  ];
  // The joints the contact frames are attached to, one per contact, in its order.
  repeated string contact_parent_joint_names = 8 [
    (legged_mpc_config.tuning) = {
      exclude_reason: "joint names of the robot model"
    }
  ];
  ArmJointNames arm_joint_names = 9;

  // A 3-DoF (point) contact: a frame the MPC adds to the model, which carries a force and no moment
  // (legged_nmpc/docs/multi_contact_planning/README.md, section 3.1).
  // Next ID: 4
  message PointContact {
    reserved 4 to max;

    // The frame's name, unique among the contacts: a new frame, which the MPC adds, or a frame of the URDF model that
    // sits exactly at parent_joint_name + pos_contact_rt_link_ewrt_link with the parent's axes (such as a foot link),
    // which the MPC then uses as is.
    string name = 1 [default = ""];
    // The joint the frame is attached to, or a joint the MPC fixes (fixed_joint_names), whose frame it then hangs from.
    string parent_joint_name = 2 [default = ""];
    // [m] The frame's position relative to its parent joint's frame, in that frame's axes.
    Xyz pos_contact_rt_link_ewrt_link = 3 [(legged_mpc_config.tuning) = { unit: "m" }];
  }

  // The 3-DoF contacts fixed on their links, such as a quadruped's point feet; none by default. They come first in the
  // centroidal MPC's input (the force of each, then the force of each rolling contact, then the wrench of each 6-DoF
  // contact, then the joint velocities) and in a mode number's bits. A contact set other than two 6-DoF feet runs on the
  // centroidal MPC only, which refuses the terms written for two feet.
  // LINT.IfChange(contacts_3dof)
  repeated PointContact contacts_3dof = 10 [
    (legged_mpc_config.tuning) = {
      exclude_reason: "the contacts of the robot model: they fix the problem's dimensions"
    }
  ];
  // LINT.ThenChange(//legged_nmpc/legged_common_mpc/src/config/model/ModelSettingsFromConfig.cpp:contacts_3dof)

  // The rolling contact of a wheel (ModelSettings::ContactKind::kRolling): a 3-DoF contact at the wheel's lowest point,
  // the wheel center less wheel_radius along the ground normal, which moves over the wheel's rim as it turns. The MPC adds
  // a frame `name` at the wheel center to the wheel's link and reads its position and twist only
  // (legged_nmpc/docs/rolling_contact/README.md). The ground is flat, with world z as its normal.
  // Next ID: 5
  message RollingContact {
    reserved 5 to max;

    // The frame's name, unique among the contacts.
    string name = 1 [default = ""];
    // The wheel's own joint, a continuous joint of the MPC model (not one of fixed_joint_names; a revolute joint with
    // position limits is refused): the frame hangs from its child link, the wheel, and turns with it. Its position
    // takes no weight in state_weights and final_state_weights, and the joint-limit constraint has no row for it.
    string parent_joint_name = 2 [default = ""];
    // [m] The wheel center relative to the frame of parent_joint_name, in that frame's axes; zero when the joint sits
    // at the wheel center. It lies on the joint's axis, since the frame turns with the wheel and an
    // offset off the axle would circle it.
    Xyz pos_wheel_rt_link_ewrt_link = 3 [(legged_mpc_config.tuning) = { unit: "m" }];
    // [m] The radius of the wheel's rim, finite and positive.
    double wheel_radius = 4 [default = 0.0, (legged_mpc_config.tuning) = { unit: "m" }];
  }

  // The rolling contacts; none by default. They follow contacts_3dof and come before the 6-DoF contacts in the input
  // (a force each) and in a mode number's bits.
  // LINT.IfChange(contacts_rolling)
  repeated RollingContact contacts_rolling = 12 [
    (legged_mpc_config.tuning) = {
      exclude_reason: "the contacts of the robot model: they fix the problem's dimensions"
    }
  ];
  // LINT.ThenChange(//legged_nmpc/legged_common_mpc/src/config/model/ModelSettingsFromConfig.cpp:contacts_rolling)

  // A leg of the robot (ModelSettings::Leg): the contacts at its end and the frame of its hip. Its lateral side and its
  // front or hind position are derived from the hip's position relative to the base at the model's neutral
  // configuration, never typed.
  // Next ID: 4
  message Leg {
    reserved 4 to max;

    // Non-empty, letters and digits only (mode names join leg names with '_'), not all digits, not FLY or STANCE, not
    // LF or RF on a set that stands on the biped's two feet (whose gait files read them as the feet), and unique among
    // the legs.
    string name = 1 [default = ""];
    // The contacts at the leg's end, by name: one or more of the contact set's contacts (contacts_3dof,
    // contacts_rolling and contact_names_6dof), each in at most one leg. One contact for a point foot or a wheel, or a
    // 6-DoF sole.
    repeated string contacts = 2;
    // A frame of the URDF model; empty: derived, the first joint below the floating base on the way from the parent
    // joint of the leg's first contact to the base.
    string hip_frame_name = 3 [default = ""];
  }

  // The legs. Absent on a biped contact set (the two 6-DoF feet alone): two legs, "left" on the first foot and "right"
  // on the second, whose derived sides must agree. Absent on any other set: no legs.
  // LINT.IfChange(legs)
  repeated Leg legs = 11 [
    (legged_mpc_config.tuning) = {
      exclude_reason: "the legs of the robot model, read at start-up"
    }
  ];
  // LINT.ThenChange(//legged_nmpc/legged_common_mpc/src/config/model/ModelSettingsFromConfig.cpp:legs)
}
