edition = "2023";

package legged_mpc_config;

import "legged_mpc_config/config_options.proto";
import "nproto/options.proto";
import "nproto/retired_field_options.proto";

// The package before the humanoid -> legged rename, which the header of a file saved before it gives.
option (nproto.former_package) = "humanoid_mpc_config";

// The weights and references of the contact-implicit terms (the task file's contact_implicit block,
// ModelSettings::ContactImplicitConfig), read whether or not soft_constraints lists contact_complementarity,
// force_weighted_slip and ground_penetration, and ignored when it does not (legged_nmpc/docs/contact_implicit_mpc/README.md).
// The two residuals are normalized, (f_n / f_ref)(h / h_ref) and (f_n / f_ref)(v / v_ref) with f_ref the robot's weight
// from the model, so their weights are dimensionless. A weight must be finite and non-negative (0 switches its term off),
// a reference and the smoothing length finite and positive (validateContactImplicitConfig()).
// Next ID: 8
message ContactImplicitConfig {
  option (nproto.generate_struct) = "ocs2::legged::mpc_config::ContactImplicitConfig";
  // Before the top-level pos_surface_rt_world_ewrt_world_z, the contact-implicit terms had a ground height of their own.
  option (nproto.retired_field) = {
    name: "terrain_height"
    replacement: "the ground is the top-level pos_surface_rt_world_ewrt_world_z of the task file, which the swing trajectories share"
  };

  reserved 8 to max;

  // The price of carrying full body weight at the reference height.
  double complementarity_weight = 1 [default = 100.0];
  // The price of sliding at the reference speed under full body weight.
  double slip_weight = 2 [default = 100.0];
  // The weight of the one-sided quadratic hinge on h >= 0: penetration_weight * h^2 / 2 below the ground, 0 above it.
  double penetration_weight = 3 [default = 50000.0];
  // [m] The height of a contact above the ground at which a fully loaded foot is as wrong as the complementarity term can
  // describe: the scale of the gap h. Normally the swing apex, swing_trajectory_config's
  // apex_pos_foot_rt_swingend_ewrt_world_z.
  double scale_pos_contact_rt_surface_ewrt_world_z = 4 [default = 0.08, (legged_mpc_config.tuning) = { unit: "m" }];
  // [m/s] A sliding speed that would already be a failure: the scale of each horizontal component of the contact's
  // velocity in the world frame.
  double scale_linvel_contact_rt_world_ewrt_world_xy = 5 [default = 0.3, (legged_mpc_config.tuning) = { unit: "m/s" }];
  // [rad/s] A pivot rate that would already be a failure: the scale of the contact's yaw rate about the world z axis.
  double scale_angvel_contact_rt_world_ewrt_world_z = 6 [default = 1.0, (legged_mpc_config.tuning) = { unit: "rad/s" }];
  // [m] The length scale the minimum height of the footprint corners is blended over.
  double gap_smoothing = 7 [default = 0.001, (legged_mpc_config.tuning) = { unit: "m" }];
}
