edition = "2023";

package legged_mpc_config;

import "legged_mpc_config/config_options.proto";
import "nproto/options.proto";

// The package before the humanoid -> legged rename, which the header of a file saved before it gives.
option (nproto.former_package) = "humanoid_mpc_config";

// The settings of the MPC loop (the task file's mpc block): the fields of ocs2::mpc::Settings, with that struct's
// defaults, converted by toMpcSettings() (legged_common_mpc/config/solver/SolverSettingsFromConfig.h), which refuses a
// value outside the range its comment states. A field without a default is a std::optional of the struct: its absence
// is a setting of its own, which OCS2's struct spells as a negative sentinel.
// Next ID: 7
message MpcSettingsConfig {
  option (nproto.generate_struct) = "ocs2::legged::mpc_config::MpcSettingsConfig";

  reserved 7 to max;

  // [s] The length of the horizon, positive.
  double time_horizon = 1 [default = 1.0, (legged_mpc_config.tuning) = { unit: "s" }];
  // [s] How much of the solution a policy carries, from its start, positive; absent: the whole horizon.
  double solution_time_window = 2 [(legged_mpc_config.tuning) = { unit: "s" }];
  // Whether the MPC logs each solve.
  bool debug_print = 3 [
    default = false,
    (legged_mpc_config.tuning) = {
      exclude_reason: "a log switch, not a tuning parameter"
    }
  ];
  // Whether each solve starts cold, from the operating trajectories, instead of warm, from the previous solution.
  bool cold_start = 4 [default = false];
  // [Hz] The rate the MPC solves at, positive; absent: once per new observation, as fast as it can.
  double mpc_desired_frequency = 5 [(legged_mpc_config.tuning) = { unit: "Hz" }];
  // [Hz] The rate of the tracking controller that runs the policy, positive.
  double mrt_desired_frequency = 6 [default = 100.0, (legged_mpc_config.tuning) = { unit: "Hz" }];
}
