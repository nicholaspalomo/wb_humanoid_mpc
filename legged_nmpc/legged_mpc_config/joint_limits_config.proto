edition = "2023";

package legged_mpc_config;

import "nproto/options.proto";

// The package before the humanoid -> legged rename, which the header of a file saved before it gives.
option (nproto.former_package) = "humanoid_mpc_config";

// The joint limits soft constraint (formerly jointLimits; the soft constraint joint_limits): the relaxed barrier on the
// URDF's position limits of every MPC joint.
// Next ID: 3
message JointLimitsConfig {
  option (nproto.generate_struct) = "ocs2::legged::mpc_config::JointLimitsConfig";

  reserved 3 to max;

  // The barrier (PieceWisePolynomialBarrierPenalty), both positive.
  double mu = 1 [default = 1.0];
  double delta = 2 [default = 0.001];
}
