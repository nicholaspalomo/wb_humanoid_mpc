version: '3.8'
services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: base
      args:
        WB_HUMANOID_MPC_DIR: "/wb_humanoid_mpc_ws"
        PYTHON_VERSION: "3.12"
        USER_ID: "${USER_ID:-1000}"
        GROUP_ID: "${GROUP_ID:-1000}"
        GIT_USER_NAME: "${GIT_USER_NAME}"
        GIT_USER_EMAIL: "${GIT_USER_EMAIL}"

    # platform selectable via DOCKER_PLATFORM on host; default uses amd64 (Rosetta on Apple Silicon)
    platform: ${DOCKER_PLATFORM:-linux/amd64}

    user: "${CONTAINER_USER:-ubuntu}"
    privileged: true
    stdin_open: true
    tty: true
    command: sleep infinity

    volumes:
      - ../../..:/wb_humanoid_mpc_ws:delegated
      - ${XDG_RUNTIME_DIR:-/tmp/xdg_runtime_dir}:${XDG_RUNTIME_DIR:-/tmp/xdg_runtime_dir}
      - ${HOME}/.gitconfig:/tmp/host.gitconfig:cached,ro
      # Mount a default ALSA config to avoid "cannot find card '0'" in headless containers
      - ./asound.conf:/etc/asound.conf:ro
      - ${HOME}/.ssh:/tmp/host_ssh:cached,z

    environment:
      # VNC display (start with `make start-vnc`, view at http://localhost:6080/vnc.html)
      DISPLAY: ":1"
      QT_X11_NO_MITSHM: "1"
      # Mesa software rendering (llvmpipe) for RViz2/OGRE inside Xvfb
      LIBGL_ALWAYS_SOFTWARE: "1"
      MESA_LOADER_DRIVER_OVERRIDE: "llvmpipe"
      LIBGL_ALWAYS_INDIRECT: "0"
      ROS_DOMAIN_ID: "0"
      PULSE_SERVER: unix:${XDG_RUNTIME_DIR}/pulse/native
      XDG_RUNTIME_DIR: ${XDG_RUNTIME_DIR}
      GIT_USER_NAME: ${GIT_USER_NAME}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL}
      COLCON_HOME: /wb_humanoid_mpc_ws
      COLCON_DEFAULTS_FILE: /wb_humanoid_mpc_ws/src/wb_humanoid_mpc/colcon.defaults.yaml

    ports:
      - "7400:7400/udp"
      - "7447:7447/udp"
      - "7410:7410/udp"
      # VNC and noVNC ports for GUI visualization on macOS
      - "5901:5901"
      - "6080:6080"
