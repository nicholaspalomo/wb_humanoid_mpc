version: '3.8'
services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: base
      args:
        WB_HUMANOID_MPC_DIR: "/wb_humanoid_mpc_ws"
        PYTHON_VERSION: "3.12"
        USER_ID: "${USER_ID:-1000}"
        GROUP_ID: "${GROUP_ID:-1000}"
        GIT_USER_NAME: "${GIT_USER_NAME}"
        GIT_USER_EMAIL: "${GIT_USER_EMAIL}"

    # TODO(nicholaspalomo): Remove the hardcoding so that this is cross compatible with Linux and MacOS
    platform: linux/amd64 # Force x86/amd64 platform for Rosetta 2 on Apple Silicon

    volumes:
      - ../../..:/wb_humanoid_mpc_ws:cached
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${XDG_RUNTIME_DIR:-/tmp/xdg_runtime_dir}:${XDG_RUNTIME_DIR:-/tmp/xdg_runtime_dir}
      - ${HOME}/.gitconfig:/home/vscode/.gitconfig

    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR}
      - GIT_USER_NAME=${GIT_USER_NAME}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL}

    network_mode: host
    privileged: true
    command: sleep infinity
