syntax = "proto3";

package nproto_test;

import "nproto/options.proto";
import "tools/nproto/test/outer.proto";
import "tools/nproto/test/scalars.proto";

// Members named like the types they hold: the generated code names those types fully qualified.
// Next ID: 3
message Shadowing {
  option (nproto.generate_struct) = "nproto::test::Shadowing";

  reserved 3 to max;

  Scalars Scalars = 1;
  Outer.Kind Outer = 2;
}
