syntax = "proto3";

// nproto's test protos (tools/nproto/test/BUILD.bazel). The package differs from the structs' namespace, nproto::test,
// so that the struct and the protobuf class of a message have different C++ names.
package nproto_test;

import "nproto/options.proto";

// Every scalar type, each one a member of its C++ type.
// Next ID: 16
message Scalars {
  option (nproto.generate_struct) = "nproto::test::Scalars";

  reserved 16 to max;

  double double_value = 1;
  float float_value = 2;
  int32 int32_value = 3;
  int64 int64_value = 4;
  uint32 uint32_value = 5;
  uint64 uint64_value = 6;
  sint32 sint32_value = 7;
  sint64 sint64_value = 8;
  fixed32 fixed32_value = 9;
  fixed64 fixed64_value = 10;
  sfixed32 sfixed32_value = 11;
  sfixed64 sfixed64_value = 12;
  bool bool_value = 13;
  string string_value = 14;
  bytes bytes_value = 15;
}
