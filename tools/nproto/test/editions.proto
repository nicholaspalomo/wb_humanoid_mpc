edition = "2023";

package nproto_test;

import "nproto/options.proto";
import "tools/nproto/test/scalars.proto";

// Edition 2023: fields have explicit presence unless they say otherwise.
// Next ID: 7
message Editions {
  option (nproto.generate_struct) = "nproto::test::Editions";

  reserved 7 to max;

  // EXPLICIT presence without a default: std::optional.
  int32 explicit_count = 1;
  int32 implicit_count = 2 [features.field_presence = IMPLICIT];
  int32 defaulted = 3 [default = 7];
  string name = 4;
  Scalars scalars = 5;
  repeated double values = 6;
}
