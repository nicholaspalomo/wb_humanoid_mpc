# Unitree G1 (29-DoF) Joint Proportional and Derivative (PD) Controller Gains
# Units: Kp in [N*m/rad], Kd in [N*m*s/rad]

default_gains:
  kp: 150.0
  kd: 8.0

joint_gains:
  # Left Leg
  left_hip_pitch_joint:
    kp: 150.0
    kd: 10.0
  left_hip_roll_joint:
    kp: 150.0
    kd: 10.0
  left_hip_yaw_joint:
    kp: 150.0
    kd: 10.0
  left_knee_joint:
    kp: 200.0
    kd: 12.0
  left_ankle_pitch_joint:
    kp: 80.0
    kd: 6.0
  left_ankle_roll_joint:
    kp: 80.0
    kd: 6.0

  # Right Leg
  right_hip_pitch_joint:
    kp: 150.0
    kd: 10.0
  right_hip_roll_joint:
    kp: 150.0
    kd: 10.0
  right_hip_yaw_joint:
    kp: 150.0
    kd: 10.0
  right_knee_joint:
    kp: 200.0
    kd: 12.0
  right_ankle_pitch_joint:
    kp: 80.0
    kd: 6.0
  right_ankle_roll_joint:
    kp: 80.0
    kd: 6.0

  # Waist / Torso
  waist_yaw_joint:
    kp: 120.0
    kd: 8.0
  waist_roll_joint:
    kp: 120.0
    kd: 8.0
  waist_pitch_joint:
    kp: 120.0
    kd: 8.0

  # Left Arm
  left_shoulder_pitch_joint:
    kp: 60.0
    kd: 4.0
  left_shoulder_roll_joint:
    kp: 60.0
    kd: 4.0
  left_shoulder_yaw_joint:
    kp: 60.0
    kd: 4.0
  left_elbow_joint:
    kp: 40.0
    kd: 3.0
  left_wrist_roll_joint:
    kp: 20.0
    kd: 1.5
  left_wrist_pitch_joint:
    kp: 20.0
    kd: 1.5
  left_wrist_yaw_joint:
    kp: 20.0
    kd: 1.5

  # Right Arm
  right_shoulder_pitch_joint:
    kp: 60.0
    kd: 4.0
  right_shoulder_roll_joint:
    kp: 60.0
    kd: 4.0
  right_shoulder_yaw_joint:
    kp: 60.0
    kd: 4.0
  right_elbow_joint:
    kp: 40.0
    kd: 3.0
  right_wrist_roll_joint:
    kp: 20.0
    kd: 1.5
  right_wrist_pitch_joint:
    kp: 20.0
    kd: 1.5
  right_wrist_yaw_joint:
    kp: 20.0
    kd: 1.5
