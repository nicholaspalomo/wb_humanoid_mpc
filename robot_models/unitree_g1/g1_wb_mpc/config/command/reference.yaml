targetDisplacementVelocity: 0.5
targetRotationVelocity: 0.5

maxDisplacementVelocityX: 2.0
maxDisplacementVelocityY: 1.2
maxDeltaPelvisHeight: 0.4
maxRotationVelocity: 1.0
# First-order low-pass filter on the operator's velocity command, run on the solver time ahead of the acceleration
# ramps: break frequency f_c [Hz], time constant 1 / (2 pi f_c). 0 switches it off and the command passes through
# unchanged, which is what every robot has effectively run so far: the "5 Hz" filter this key replaces never updated
# its state and scaled the command by t / (t + 0.032 s), t the wall-clock time since start-up - within 3% of the
# identity after a second. A filter lags every command, a stop included, by about its time constant: try e.g. 2.0
# (80 ms) in simulation before a robot. Reloaded with the limits above while the controller runs.
# LINT.IfChange(velocity_command_filter)
velocityCommandFilterBreakFrequency: 0.0  # [Hz] command low-pass filter, 0 = off
# LINT.ThenChange(//humanoid_nmpc/humanoid_common_mpc/include/humanoid_common_mpc/reference_manager/ProceduralMpcMotionManager.h:velocity_command_filter_key)
targetJointStateInterpolationTimeConstant: 0.5

defaultBaseHeight: 0.7911

defaultJointState:
  "(0,0)": -0.05  # left_hip_pitch_joint
  "(1,0)": 0.0  # left_hip_roll_joint
  "(2,0)": 0.0  # left_hip_yaw_joint
  "(3,0)": 0.1  # left_knee_joint
  "(4,0)": -0.05  # left_ankle_pitch_joint
  "(5,0)": 0.0  # left_ankle_roll_joint
  "(6,0)": -0.05  # right_hip_pitch_joint
  "(7,0)": 0.0  # right_hip_roll_joint
  "(8,0)": 0.0  # right_hip_yaw_joint
  "(9,0)": 0.1  # right_knee_joint
  "(10,0)": -0.05  # right_ankle_pitch_joint
  "(11,0)": 0.0  # right_ankle_roll_joint
  "(12,0)": 0.0  # waist_yaw_joint
  "(13,0)": 0.0  # waist_roll_joint
  "(14,0)": 0.0  # waist_pitch_joint
  "(15,0)": 0.0  # left_shoulder_pitch_joint
  "(16,0)": 0.0  # left_shoulder_roll_joint
  "(17,0)": 0.0  # left_shoulder_yaw_joint
  "(18,0)": 0.0  # left_elbow_joint
