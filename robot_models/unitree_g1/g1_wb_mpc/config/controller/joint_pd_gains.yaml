# Unitree G1 (29-DoF) Joint Proportional and Derivative (PD) Controller Gains
# Units: Kp in [N*m/rad], Kd in [N*m*s/rad]

# torque_limit is read by the MRT joint controller, which clamps the commanded joint torque against it and
# falls back to a hard-coded 500 N*m for any joint that does not carry one. These values are the model's own
# actuatorfrcrange, so the controller and the simulator now agree on what each actuator can deliver.
default_gains:
  kp: 150.0
  kd: 8.0
  torque_limit: 139.0

joint_gains:
  # Left Leg
  left_hip_pitch_joint:
    kp: 150.0
    kd: 10.0
    torque_limit: 88.0
  left_hip_roll_joint:
    kp: 150.0
    kd: 10.0
    torque_limit: 88.0
  left_hip_yaw_joint:
    kp: 150.0
    kd: 10.0
    torque_limit: 88.0
  left_knee_joint:
    kp: 200.0
    kd: 12.0
    torque_limit: 139.0
  left_ankle_pitch_joint:
    kp: 80.0
    kd: 6.0
    torque_limit: 50.0
  left_ankle_roll_joint:
    kp: 80.0
    kd: 6.0
    torque_limit: 50.0

  # Right Leg
  right_hip_pitch_joint:
    kp: 150.0
    kd: 10.0
    torque_limit: 88.0
  right_hip_roll_joint:
    kp: 150.0
    kd: 10.0
    torque_limit: 88.0
  right_hip_yaw_joint:
    kp: 150.0
    kd: 10.0
    torque_limit: 88.0
  right_knee_joint:
    kp: 200.0
    kd: 12.0
    torque_limit: 139.0
  right_ankle_pitch_joint:
    kp: 80.0
    kd: 6.0
    torque_limit: 50.0
  right_ankle_roll_joint:
    kp: 80.0
    kd: 6.0
    torque_limit: 50.0

  # Waist / Torso
  waist_yaw_joint:
    kp: 120.0
    kd: 8.0
    torque_limit: 88.0
  waist_roll_joint:
    kp: 120.0
    kd: 8.0
    torque_limit: 50.0
  waist_pitch_joint:
    kp: 120.0
    kd: 8.0
    torque_limit: 50.0

  # Left Arm
  left_shoulder_pitch_joint:
    kp: 60.0
    kd: 4.0
    torque_limit: 25.0
  left_shoulder_roll_joint:
    kp: 60.0
    kd: 4.0
    torque_limit: 25.0
  left_shoulder_yaw_joint:
    kp: 60.0
    kd: 4.0
    torque_limit: 25.0
  left_elbow_joint:
    kp: 40.0
    kd: 3.0
    torque_limit: 25.0
  left_wrist_roll_joint:
    kp: 20.0
    kd: 1.5
    torque_limit: 25.0
  left_wrist_pitch_joint:
    kp: 20.0
    kd: 1.5
    torque_limit: 5.0
  left_wrist_yaw_joint:
    kp: 20.0
    kd: 1.5
    torque_limit: 5.0

  # Right Arm
  right_shoulder_pitch_joint:
    kp: 60.0
    kd: 4.0
    torque_limit: 25.0
  right_shoulder_roll_joint:
    kp: 60.0
    kd: 4.0
    torque_limit: 25.0
  right_shoulder_yaw_joint:
    kp: 60.0
    kd: 4.0
    torque_limit: 25.0
  right_elbow_joint:
    kp: 40.0
    kd: 3.0
    torque_limit: 25.0
  right_wrist_roll_joint:
    kp: 20.0
    kd: 1.5
    torque_limit: 25.0
  right_wrist_pitch_joint:
    kp: 20.0
    kd: 1.5
    torque_limit: 5.0
  right_wrist_yaw_joint:
    kp: 20.0
    kd: 1.5
    torque_limit: 5.0
