# EngineAI SA01 centroidal MPC task configuration.
#
# SA01 is a LEGS-ONLY biped: 12 revolute joints, no arms, no waist and no head. The MPC state is therefore
# 6 (normalised centroidal momentum) + 6 (base pose) + 12 (joint positions) = 24, and the input is
# 2 x 6 (contact wrenches) + 12 (joint velocities) = 24. Total mass 33.11 kg, 0.725 m from the hip pitch axis to the
# sole, a 0.27 x 0.10 m sole and only 0.150 m between the hips - it is a narrow, short-legged, long-footed robot.
#
# This file ships the VALIDATED BASELINE formulation, the same one the Unitree R1 runs: base-pose tracking, a gait
# schedule, wrench inputs and a quadratic terminal cost. Every newer feature is off, pre-parameterised, and documented
# where it is switched on, so they can be enabled ONE AT A TIME and validated in MuJoCo. The weights are R1's, which
# is the closest robot by mass (28.8 kg against SA01's 33.1 kg) and runs the same formulation; they are a starting
# point, not a tuned set.

# Simulation & Telemetry Configuration
enableTelemetry: true        # Enable high-rate ROS 2 telemetry publishing for PlotJuggler
telemetryFrequency: 100      # [Hz] Telemetry publishing frequency (decimated from MRT loop)
# MuJoCo simulator only (mujoco_sim.launch.py). The viewer's contact timeline ('b' toggles it) shows, per contact point,
# the contact state the executed MPC policy plans against the simulator's ground truth over a sliding window of time.
simContactTimelineWindow: 5.0          # [s] width of the sliding window
simContactForceThreshold: 5.0          # [N] normal force above which a contact point counts as touching (ground truth).
                                       #     SA01 weighs 324.8 N, so this is 1.5% of body weight.
# Fall recovery: the tilt of the base past which the simulator catches the robot on the gantry, reattaching it upright
# at the gantry height, switching to JOINT_PD (the whole-body MPC is overconstrained against a pinned base) and
# resetting the MPC. The remote control follows the same transition and re-centres its joysticks, so a stick left
# forward cannot keep commanding a walk into a robot hanging from the harness. The measure is the angle between the
# base's own vertical and the world vertical, so it is heading independent: 0 upright, pi/2 on its side, pi upside
# down. 0 disables the recovery and leaves a fallen robot where it lands, which is what you want when the fall itself
# is the thing being studied. 1.0 rad (57 deg) is past any recoverable lean.
simMaxBaseTiltAngle: 1.0                # [rad] 0 disables
# Measured contact state of the controller, by name (robot_model/ContactEstimatorRegistry.h): the MPC observation mode and
# which planned contact wrenches the inverse dynamics projects into feedforward torques. One of:
#   cheater_sim        the ground truth of the physics (normal force above simContactForceThreshold); required for the
#                      phase_resetting execution rule of contact_planning.yaml
#   robot_state        the contact flags of the RobotState (in MuJoCo the same ground truth)
#   always_in_contact  every contact point touching: the executed schedule is taken as the measured contact state
# How the virtual gantry holds the floating base while it is locked. Two different physical models, so the name selects
# one rather than a boolean switching a feature on:
#   weld_constraint    a MuJoCo weld the solver satisfies INSIDE mj_step, so the base is really supported while the
#                      dynamics are integrated. This is what a physical gantry does, and the only setting under which
#                      GRAVITY_COMP holds the limbs still.
#   kinematic_teleport legacy: qpos/qvel are overwritten just BEFORE mj_step, leaving the base unsupported during the
#                      step. The robot is then in free fall while integrating, and a free-falling chain in uniform
#                      gravity needs zero joint torque to keep its shape, so the commanded gravity torque is entirely
#                      surplus lift: measured ~130 deg of joint drift in 3 s, into the stops. Kept only to reproduce
#                      recorded runs.
# LINT.IfChange(gantry_hold)
gantryHold: weld_constraint
# LINT.ThenChange(//robot_runtime/mujoco_sim_interface/include/mujoco_sim_interface/MujocoSimInterface.h:gantry_hold_names)
# LINT.IfChange(contact_estimator)
contactEstimator: cheater_sim
# LINT.ThenChange(//robot_runtime/robot_model/src/ContactEstimatorRegistry.cpp:contact_estimator_names, //robot_runtime/mujoco_sim_interface/src/CheaterSimContactEstimator.cpp:cheater_sim_contact_estimator_name)
# Viewer visualizations (each listed one starts on; the key in brackets toggles it, 'p' prints the cheatsheet). Every
# marker is a class in robot_runtime/mujoco_sim_interface/.../visualization; the names are those of VisualizationRegistry.
# LINT.IfChange(sim_visualizations)
simVisualizations:
  - metrics                 # render/sim FPS, real-time factor and drift (top-left text)
  - external_forces         # arrows of the external forces applied to the bodies (pushes)
  - contact_forces          # arrows of the physical contact forces on the robot
  - base_velocity           # measured (red) vs commanded (green) base velocity and yaw rate at the CoM
  - contact_timeline        # [b] barcode of planned vs ground-truth contact per contact point
  - target_contact_patches  # [g] contact patch of every foot at the planner's target position and yaw
  - center_of_mass          # [o] whole-body centre of mass: sphere, vertical, and its shadow on the ground
  - zmp                     # [z] zero moment point of the physical ground reaction, on the ground
  # The ZMP marker earns its place on SA01 more than on any other robot here: with a 24 N.m ankle under 324.8 N of
  # body weight the ankle can only hold the centre of pressure within 0.074 m of itself in single support, so watch
  # whether the ZMP is running to the toe. See contacts.contact_rectangle below.
  # - dcm                   # [d] divergent component of motion (capture point) of the measured CoM, on the ground
  # MuJoCo's own markers, off unless listed:
  # - mj_contact_points     # [c] markers at the physical contact points
  # - mj_contact_forces     # [f] MuJoCo's normal and friction force arrows at the contacts
  # - mj_com                # [m] centre of mass markers of the bodies
  # - mj_inertia            # [i] equivalent inertia ellipsoids
  # - mj_convex_hull        # [h] convex hulls of the meshes
  # - mj_transparent        # [t] model transparency (x-ray view)
# LINT.ThenChange(//robot_runtime/mujoco_sim_interface/src/visualization/VisualizationRegistry.cpp:visualization_names)
enableOnlineTuning: true     # Enable runtime parameter and gain tuning in Controller GUI

# ---------------------------------------------------------------------------------------------------------------
# Formulation toggles. All four are off: SA01 has never been run, so it starts on the formulation the other robots
# are tuned against. Each one below says what enabling it needs.
# ---------------------------------------------------------------------------------------------------------------
# Set true to use basis-vector scalings lambda as MPC contact inputs (instead of direct wrenches). The wrench cone is
# then structural rather than a soft constraint. Nothing robot-specific blocks it; the `contacts` block below already
# carries basisNonNegativityBarrier and basisScalingRegularization, so this is a one-line change once the robot walks.
useContactBasisVectorInputs: true
# Set true to regulate CoM + Angular Center of Mass (ACoM) instead of base pose.
#
# THE WEIGHTS NOW EXIST: AcomSirenWeightsSa01.h is trained and wired into AngularCenterOfMass::createForRobot, so this
# no longer throws "Unknown robot 'engineai_sa01'" at start-up. Retrain with
#   bazel run //humanoid_learning/acom:train_main -- --robot sa01 --install_header
#
# It is still false, and that is a tuning decision rather than a missing part. Two things stand between here and true:
#  - Q_com and Q_acom are absent from this file. While this is false, Q's base-pose block (6..11) below is live and
#    those two are not read, so they are deliberately absent rather than present and dead; turning this on means
#    writing them, because the base-pose block is zeroed by the factory in that mode.
#  - SA01 is LEGS ONLY - twelve joints, no arms, no waist, no torso link. The aCOM coordinate exists because limb
#    motion decouples whole-body orientation from base orientation, and on Atlas and G1 the arms do most of that
#    work. Here only the legs contribute, so the offset is a real but smaller correction, and whether it earns the
#    retune is a question for simulation rather than for this comment.
useComAndAcomTracking: false
# Set true to plan the contact sequence, timing and footholds online with the reduced-order contact planner instead
# of the gait schedule. Its parameters are the contact_planning block of contact_planning.yaml next to this file,
# which is shipped with SA01's geometry already worked out (hot-reloaded and edited by the tuning GUI like this file).
useContactPlanning: false
# Set true to end the horizon with the DCM (capture point) viability cost; Q_final / terminal_cost are then ignored.
# The dcm_terminal_cost block below is parameterised for SA01, so this is also a one-line change.
useDcmTerminalCost: true

# Targeted Pinocchio frames for telemetry logging (position, orientation, twist, accel, wrench). SA01 has no pelvis
# and no torso link - base_link IS the floating base.
telemetryFrames:
  - "foot_l_contact"
  - "foot_r_contact"
  - "base_link"

centroidalModelType: 0  # 0: FullCentroidalDynamics, 1: Single Rigid Body Dynamics

# MPC Problem Formulation Tasks
# The schedule-gated contact formulation: the swing foot's wrench is forced to zero and the stance foot is held still,
# both from the gait schedule, so the MPC cannot depart from that schedule. The contact-implicit alternative
# (arXiv:2502.15630, humanoid_nmpc/docs/contact_implicit_mpc/README.md) replaces those with relaxed complementarity
# conditions and lets the solver decide where each foot carries load. To switch, drop zero_wrench, zero_velocity AND
# normal_velocity here, add normal_velocity plus contact_complementarity, force_weighted_slip and ground_penetration
# to soft_constraints, and give nominal_foothold.stepWidth a positive value - nothing else would then hold SA01's
# feet apart. loadMpcFormulationTasks refuses the half-way combinations.
hard_constraints:
  - zero_wrench
  - zero_velocity
  - normal_velocity

soft_constraints:
  - joint_limits
  - foot_collision
  - contact_wrench_cone            # friction, centre of pressure and torsional limits in one relaxed-barrier term
  # - normal_velocity              # contact-implicit: the swing-foot vertical servo, PRICED instead of imposed
  # - contact_complementarity      # contact-implicit: f_n * h = 0, load only where the foot touches the ground
  # - force_weighted_slip          # contact-implicit: f_n * v_xy = 0, a loaded foot is held still
  # - ground_penetration           # contact-implicit: h >= 0, required alongside contact_complementarity

costs:
  - state_quadratic_cost
  - input_quadratic_cost
  - terminal_cost  # quadratic Q_final terminal cost, ignored while useDcmTerminalCost is true
  - icp_cost
  - task_space_foot_cost
  - external_torque_cost
  # task_space_torso_cost is deliberately absent: SA01 has no torso or waist link to track. Its only body above the
  # legs is base_link, which IS the floating base and is already regulated by Q(6,6)..Q(11,11). Listing the cost
  # without a matching `task_space_costs` block throws (CentroidalMpcInterface::addTaskSpaceKinematicsCosts calls
  # pt.get_child("task_space_costs")), so the block is absent too.

# The nominal foothold reference, used only when useContactPlanning is false. With zero_velocity in hard_constraints
# the stance foot is pinned by the schedule and foot placement follows from it, which is why R1 and G1 leave this at
# 0 and SA01 does too. It only becomes load-bearing for the contact-implicit formulation, which removes that pin: a
# positive stepWidth then places each foot half of it to its own side of the reference base pose.
#
# stepWidth is the FULL distance between the feet. SA01's natural stance - both legs vertical - is 0.160 m, so 0.18
# is the value to set here when that day comes, not Atlas's 0.45. How hard the foot is held to the target is
# task_space_foot_cost_weights.pos_x / pos_y, which are 0 below for the same reason.
# LINT.IfChange(nominal_foothold_config)
nominal_foothold:
  stepWidth: 0.0  # [m] lateral distance between the feet; 0 disables the nominal reference
# LINT.ThenChange(//humanoid_nmpc/humanoid_common_mpc/src/common/ModelSettings.cpp:nominal_foothold_yaml_path)

# [m] Where the ground is, for everything that needs to know: the swing trajectories, the landing targets, and the
# contact-implicit complementarity and ground-penetration terms. A constant is correct here because every layer of
# this stack assumes flat ground.
# LINT.IfChange(terrain_height_config)
terrainHeight: 0.0
# LINT.ThenChange(//humanoid_nmpc/humanoid_common_mpc/src/common/ModelSettings.cpp:terrain_height_yaml_path, //humanoid_nmpc/humanoid_centroidal_mpc/src/mrt/MpcParameterUpdaterModule.cpp:terrain_height_updater_yaml_path)

# Weights of the contact-implicit terms; read whether or not those terms are listed, ignored when they are not.
# The two residuals are normalised before they are penalised - (f_n/f_ref)(h/h_ref) and (f_n/f_ref)(v/v_ref), with
# f_ref the robot's weight taken from the model - so these weights are dimensionless and directly comparable with the
# task_space_foot_cost_weights they compete against.
# LINT.IfChange(contact_implicit_config)
contact_implicit:
  complementarityWeight: 50    # the price of carrying full body weight at the reference height
  slipWeight: 150              # the price of sliding at the reference speed under full body weight
  # Weight of the one-sided quadratic hinge on h >= 0: the cost is penetrationWeight * h^2 / 2 below the ground and
  # exactly zero on or above it. Scaled from Atlas's 5e4 by the mass ratio (33.1 / 159.7), so that a 1 cm penetration
  # produces the same gradient relative to body weight.
  penetrationWeight: 1.0e4
  heightReference: 0.08        # swing trajectory height reference [m]; tracks swing_trajectory_config.swingHeight
  velocityReference: 0.3       # [m/s] a sliding speed that would already be a failure
  angularVelocityReference: 1.0  # [rad/s] a pivot rate that would already be a failure
  gapSmoothing: 1.0e-3         # [m] length scale the footprint corners' minimum height is blended over
# LINT.ThenChange(//humanoid_nmpc/humanoid_common_mpc/src/common/ModelSettings.cpp:contact_implicit_yaml_path)

# ---------------------------------------------------------------------------------------------------------------
# Locomotion heuristics: the regularization heuristics of Gerardo Bledt, "Regularized Predictive Control Framework
# for Robust Dynamic Legged Locomotion", MIT 2020, Appendix C. Derivations, a block diagram and the seam of every
# name below are in humanoid_nmpc/docs/locomotion_heuristics/README.md.
#
# This is a reference-SHAPING layer, not a new cost family. Nothing here adds a term to the optimal control problem:
# every name modifies a reference that a cost this file ALREADY lists regularizes against, which is what RPC means
# by regularization. Three channels, three lists, three seams:
#
#   base_pose  the roll, pitch and height of the base-pose reference that Q(9,9), Q(10,10), Q(11,11) and Q(8,8)
#              track, shaped per shooting node in SwitchedModelReferenceManager::getDesiredState(). That reference
#              currently carries a HARD ZERO for roll and pitch - the target calculator writes
#              targetPose[4] = targetPose[5] = 0.0 on every call - so anything listed here is the first opinion this
#              MPC has ever had about how the base is carried. Inert while useComAndAcomTracking is true, because
#              the cost factory zeroes Q's base-pose block in that mode.
#   foothold   the landing target of the swing foot, shaped in nominalFoothold(), which the foot task-space cost
#              tracks through task_space_foot_cost_weights.pos_x / pos_y. REQUIRES useContactPlanning: false and is
#              rejected at start-up otherwise: the online planner supplies footholds itself and never consults
#              these, so listing both would be silently inert. They do nothing while pos_x and pos_y are 0.
#   wrench     the contact-force reference the input costs regularize against, shaped in getDesiredInput(). That
#              reference is weight compensation and nothing else today: m*g split evenly over the feet the mode
#              schedule calls stance feet, purely vertical.
#
# THE COEFFICIENTS BELOW ARE DERIVED FOR THIS ROBOT, AND ALL THREE LISTS ARE STILL EMPTY. Those are two separate
# switches on purpose: `make derive-heuristic-parameters ROBOT=engineai_sa01` regenerates every number below from this
# robot's URDF, gait and command limits, so the starting point is ready - but nothing is turned on until a name is
# uncommented, and each of these still changes the closed loop. SA01 has never been run at all, so that matters more
# here than anywhere else.
#
# ALL THREE LISTS ARE EMPTY, deliberately. Each changes the closed loop and none has been validated in simulation
# under hardware-like conditions on this robot; Bledt's own coefficients were fitted to a 9 kg quadruped. Uncomment
# ONE name, sweep its block in MuJoCo, and only then move to the next - which is how the dissertation itself
# proceeds (section 4.3, figure 4-13: one heuristic per panel, the viable operating region measured after each).
#
# The list is the switch and the block is the tuning, and the two are independent. Every fitted coefficient of
# Table C.2 ships at ZERO, so a name uncommented with its block untouched is still exactly a no-op - which makes
# "does listing it change anything at all" a separate experiment from "what should the number be". The analytic
# heuristics of Table C.1 (hip_centered_stepping, capture_point, impulse_scaling, centripetal_acceleration) have no
# fitted coefficients, only unit scales, so for those four the list entry alone is the change.
#
#
# SA01 NOTES. nominal_foothold.stepWidth is 0 here and useContactPlanning is false, so a foothold heuristic would be
# the ONLY thing in this configuration with an opinion about where the feet go sideways - and it still needs
# task_space_foot_cost_weights.pos_x / pos_y raised off 0 to reach anything. capture_point.comHeightOverride may be
# left at 0 to use the measured height; the value it would otherwise take is 0.6124 m, the same CoM height
# dcm_terminal_cost.comHeight and contact_planning.yaml shared.comHeight already record. With 24 N.m ankles under
# 324.8 N of body weight this robot has the least centre-of-pressure authority of the five here, which makes
# orientation_compensation the first name worth trying and hip_centered_stepping the last.
#
# Note for the tuning GUI: slider ranges are derived from the value, so a coefficient at 0 gets a (0, 1) slider and
# cannot be dragged negative. Several of these are physically negative (height_compensation.heightPerSpeed, for one).
# Type the value into the entry box, which widens the bounds.
#
# Orientation sign: the base pose is Euler ZYX about a z-up world, so a POSITIVE pitch puts the nose DOWN. Leaning
# into a forward command is therefore a POSITIVE pitchPerForwardVelocity - the sign of Bledt's own fitted +0.0725.
# LINT.IfChange(locomotion_heuristics_config)
locomotion_heuristics:

  # The offsets within a list are SUMMED, so the order here is documentary only - unlike the contact planner's
  # `costs` list, where order is the floating-point accumulation order.
  base_pose:
    - orientation_compensation   # H_Theta(pdot): roll from lateral speed, pitch from forward speed
    - periodic_orientation       # H_Theta(Phi):  roll/pitch limit cycle in the gait phase
    - height_compensation        # H_z(v):        base height against speed
  foothold:
    - hip_centered_stepping      # H_r(Theta):        foot under its own hip - READ ITS BLOCK BELOW FIRST
    - capture_point              # H_r(pdot, Phi):    step into the velocity ERROR
    - translational_stepping     # H_r(pdot):         step in the direction of travel
    - in_place_turning           # H_r(psidot):       step along the turn arc
    - high_speed_turning         # H_r(pdot x omega): step outward along the turn radius
  wrench:
    - impulse_scaling            # H_f(Phi):            stance force scaled by 1 / duty factor
    - centripetal_acceleration   # H_f(Theta x pdot):   the horizontal force of a turn - SEE ITS BLOCK BELOW

  # ---- one parameter block per heuristic, keyed by the heuristic's own registry name ----

  # H_Theta(pdot) = a1 * pdot + a0  (Table C.2, equations 4.11 and 4.12). The velocity is the COMMANDED CoM velocity
  # in the reference base's yaw frame, so a1 is a lean per unit of commanded speed and a0 a standing trim. Bledt did
  # not design this one, he regressed it out of the optimizer's own choices (R^2 of 0.98 and 0.95) and found that
  # injecting it back both enlarged the viable operating region and improved the simplified orientation dynamics'
  # own validity, because the body sits closer to level at speed.
  orientation_compensation:
    # 0, and deliberately so rather than for want of a number. At a CONSTANT sidestep velocity there is no net lateral
    # force to lean against, and what a biped's roll actually does in single support is oscillate at gait frequency -
    # which is periodic_orientation's job below and not this one's.
    rollPerLateralVelocity: 0.0     # a1 [rad s/m] roll reference per commanded lateral speed
    rollOffset: 0.0                 # a0 [rad] standing roll trim
    # 0.0611 puts the nose down 0.049 rad (2.8 deg) at the 0.8 m/s of reference.yaml maxDisplacementVelocityX, and
    # POSITIVE is nose-down here (Euler ZYX about a z-up world). The coefficient is HALF AGAIN Atlas's 0.0407 purely
    # because SA01's stick is smaller (0.8 against 1.2 m/s): the lean at full command is the same 2.8 deg on both.
    pitchPerForwardVelocity: 0.0611  # a1 [rad s/m] pitch per commanded forward speed
    pitchOffset: 0.0                # a0 [rad] standing pitch trim
    # 0.15 rad = 8.6 deg. The control model replaces R(Theta) with R_z(psi), so a reference tilt large enough to make
    # that approximation wrong is a reference the dynamics cannot follow.
    maximumTilt: 0.15               # [rad] each of roll and pitch is clamped to +/- this; the command is not rate limited

  # H_Theta(Phi) = b1 * sin(c1 * Phi + d1)  (Table C.2, equation 4.13), with Phi the gait phase in [0, 1). [0, 0.5)
  # is the LF mode and [0.5, 1) the RF mode, and those name the foot IN CONTACT, not the one swinging - so the first
  # half of the cycle is left stance with the RIGHT foot in the air. Phi FREEZES at 0.0 or 0.5 through double support
  # rather than advancing, so this holds a constant offset there instead of continuing its cycle.
  # The two rates are pre-wired to the two shapes that make sense, so only the amplitudes have to be found.
  periodic_orientation:
    # 0.03 rad = 1.7 deg of pelvic obliquity. The PHASE follows from the mode semantics with nothing left to fit:
    # phase [0, 0.5) is LF, i.e. LEFT STANCE, so its midpoint is 0.25; a positive roll raises the left side (rotation
    # about +x carries +y towards +z), which is the stance side; and with rate 2*pi and offset 0 the sinusoid peaks at
    # exactly 0.25. So the reference drops the hip on the SWING side through each single support.
    #
    # This is the heuristic to watch first on SA01. Its hips are 0.150 m apart - the narrowest of the four robots -
    # so the lateral pendulum has the least to work with and the roll is the channel most worth shaping.
    rollAmplitude: 0.03             # b1 [rad]
    rollPhaseRate: 6.2831853        # c1 [rad per unit phase]; 2*pi = one period per left-right cycle
    rollPhaseOffset: 0.0            # d1 [rad]; 0 puts the peak at mid left stance - see above
    # 0, because the phase cannot be derived the way roll's can: pitch oscillates once per STEP and where in the step
    # its extremum falls is a property of this robot's mass distribution and cadence. A sinusoid at the wrong phase is
    # worse than none, so this is the coefficient Bledt's extraction framework exists to produce (R^2 = 0.835).
    pitchAmplitude: 0.0             # b1 [rad]
    pitchPhaseRate: 12.5663706      # c1 [rad per unit phase]; 4*pi = one period per step
    pitchPhaseOffset: 0.0           # d1 [rad]

  # H_z(v) = a2*v^2 + a1*v + a0  (Table C.2) in the MAGNITUDE of the commanded horizontal velocity, applied as an
  # OFFSET to the reference height and never as an absolute height - the same channel carries the terrain that
  # adaptToCurrentGroundHeight() writes, and an absolute value would silently become a terrain override.
  # Crouching with speed buys the swing leg vertical room within the same joint range; it costs knee torque headroom.
  height_compensation:
    # 0, until a sweep of the linear term shows curvature worth fitting.
    heightPerSpeedSquared: 0.0      # a2 [m s^2/m^2]
    # -0.0375 lowers the base 0.03 m at the 0.8 m/s stick, i.e. 3.7% of the 0.8135 m defaultBaseHeight. On a robot
    # with only 0.725 m from hip pitch to sole that is a real fraction of the leg, so watch the knee torque: SA01's
    # actuators are the smallest here and the crouch is paid for in exactly the joint that is already working hardest.
    heightPerSpeed: -0.0375         # a1 [m s/m]
    heightOffset: 0.0               # a0 [m]
    maximumHeightOffset: 0.05       # [m] clamped to +/- this; 0.05 leaves the clamp off the value above at full stick

  # H_r(Theta) = PTP(R(Theta) * r_hip)  (Table C.1): the foot under its own hip, ground-projected. r_hip is derived
  # from the robot model at start-up and is never a key here; these two scales stretch it.
  #
  # WARNING. This is the one heuristic in the family that is not a small correction: it MOVES THE ANCHOR of the
  # foothold reference from the stance foot to the measured base, and SwitchedModelReferenceManager.h argues
  # explicitly against that - in single support the base sits roughly over the stance foot, so offsets taken from it
  # give less separation than intended. Bledt never uses it alone; it is the base term the Table C.2 velocity terms
  # are summed on top of (figure 4-8), and alone it walks a few slow steps and falls as soon as it has speed. The
  # layer prints a warning when it is listed alone, and another when the others are listed without it.
  hip_centered_stepping:
    # 1.0, and here that is not a placeholder: SA01's hip yaw joints sit at y = +/-0.075 m and the legs stand very
    # nearly vertical, so an unscaled hip-centred stance is 0.150 m - the stance the robot already has. And since
    # nominal_foothold.stepWidth is 0 on this robot there is no other stance for the heuristic to reproduce, which
    # makes SA01 the one robot here where switching this on does not resize anything. Use 1.20 to match the 0.18 m
    # orbit the contact planner would place (contact_planning.yaml hlip.stepWidth), which is the wider and more
    # forgiving of the two on a robot whose lateral pendulum diverges as fast as this one's.
    lateralScale: 1.0               # multiplies the model's hip lateral offset; 0 removes the lateral part
    longitudinalScale: 1.0          # inert on SA01: both hip joints sit at x = 0, so the fore-aft offset is zero

  # H_r(pdot, Phi) = gain * sqrt(p_z / g) * (pdot - pdot_d)  (Table C.1): the capture-point offset of the VELOCITY
  # ERROR, and the only heuristic here that reacts to a push rather than to a command - it is identically zero
  # whenever the robot is going as fast as it was asked to. sqrt(z/g) is 1/omega, the same pendulum time constant
  # the DCM terminal cost and the ZMP/DCM viewer markers already use.
  capture_point:
    gain: 1.0                       # 1.0 is the textbook capture point
    # 0.6124 m, and on SA01 this number is unusually trustworthy: it is what the model gives at `initialState`, what
    # dcm_terminal_cost.comHeight says, and what contact_planning.yaml shared.comHeight says, all three in agreement.
    # (The DRC Atlas is NOT in that happy position - see the note in its own block.) omega is then
    # sqrt(9.81 / 0.6124) = 4.00 rad/s and the offset is 0.250 s per m/s of velocity error - the fastest pendulum of
    # the four robots, so the capture step is correspondingly small and this heuristic correspondingly gentle.
    comHeightOverride: 0.6124       # [m] 0: use the CoM height measured each solve; positive: use this fixed value
    gravity: 9.81                   # [m/s^2]
    # 0.232 m = 40% of contact_planning.yaml foot_separation.maxStepLength (0.58 m). Unlike the Atlas the lateral room
    # here is symmetric enough not to bind: nominal_foothold.stepWidth is 0, so nothing is pinned against
    # foot_separation.maxStepWidth to begin with.
    maximumOffset: 0.232            # [m] clamped in MAGNITUDE, which preserves the direction of the step into the error

  # H_r(pdot) = a1 * pdot + a0  (Table C.2): step in the direction of travel, in the base's yaw frame. The largest
  # single effect in the dissertation: a foot placed under the hip at lift-off is behind the robot by touch-down, so
  # the stance that follows tips the robot the way it is already going. Roughly doubled the usable stance per step
  # and multiplied the top speed (figure 4-9). Expect a1 near half the stance duration.
  translational_stepping:
    # 0.25 s = half the step period of the shipped `trot` gait (gait.yaml: LF and RF for 0.5 s each). That is
    # Raibert's half-stance rule, and it composes with the anchor rather than duplicating it: the anchor is the stance
    # foot carried forward by the commanded velocity over the time remaining until touch-down, so at mid-swing the
    # anchor supplies half a step and this the other half, putting the target one step length ahead of the stance foot.
    #
    # RESCALE IT WITH THE GAIT - the step period is what sets it. `walk` (step 0.7 s) wants 0.35, `run` (step 0.4 s)
    # wants 0.2. And note that SA01's contact planner runs a far quicker cadence than any of these (sspDuration 0.22 +
    # dspDuration 0.05, so a 0.27 s step), which would want 0.135 - but the planner supplies its own footholds and
    # rejects this family outright, so that cadence is not the one to size against.
    forwardPerForwardVelocity: 0.25  # a1 [m s/m]
    forwardOffset: 0.0              # a0 [m]
    lateralPerLateralVelocity: 0.25  # a1 [m s/m]; same half-step rule on the lateral axis
    lateralOffset: 0.0              # a0 [m] applied to this foot's OWN SIDE; 0 because hip_centered_stepping already
                                     #     sets the separation on this robot

  # H_r(psidot) = a1 * psidot + a0  (Table C.2): step along the turn arc while turning on the spot (figure 4-10).
  # psidot is the COMMANDED yaw rate. The FORWARD term is signed per foot and the lateral one is not, which is what
  # makes it a rotation: on a turn in place the two feet must move fore-aft in opposite directions.
  #
  # DIRECTION. A foot at r relative to the base moves at omega x r, so the LEFT foot at (0, +d) moves at
  # (0,0,psidot) x (0,d,0) = (-psidot*d, 0) - BACKWARDS for a counter-clockwise turn, while the right foot moves
  # forwards. (To turn left you swing the right foot forward and around it and the left foot back.) The code carries
  # that sign, so a POSITIVE forwardPerYawRate leads each hip into the turn, which is the point of the heuristic; the
  # opposite convention would make a positive number drive the feet to trail the hips by twice the intended amount.
  in_place_turning:
    # The half-step rule applied to the speed the HIP travels at rather than the body: a foot 0.075 m from the centre
    # moves at 0.075 * psidot, so half a 0.5 s step of that is 0.0187. At the 1.0 rad/s of reference.yaml
    # maxRotationVelocity that is a 0.019 m fore-aft displacement per foot - THREE TIMES SMALLER than the Atlas's,
    # entirely because SA01's stance is a third as wide. A narrow robot has little to gain here.
    forwardPerYawRate: 0.0187       # a1 [m s/rad], positive leads each hip into the turn
    forwardOffset: 0.0              # a0 [m]
    lateralPerYawRate: 0.0          # a1 [m s/rad]; 0 - a turn on the spot has no net lateral drift to follow
    lateralOffset: 0.0              # a0 [m] applied to this foot's own side

  # H_r(pdot x omega) = a1 * (pdot x omega) + a0  (Table C.2): throw the feet out along the turn radius at speed.
  # The heuristic the extraction framework found and the designer had not: without it the robot "tended to fall
  # outwards along the turning radius as if it were an object slipping off a spinning plate" (section 4.3), and
  # Bledt only afterwards recognised it as the placement that lines up with the resultant of gravity and the
  # centripetal acceleration (equation 4.31). Zero at zero speed however fast the robot spins, which is what
  # distinguishes it from in_place_turning. With omega = psidot e_z the cross product is (v_y*psidot, -v_x*psidot).
  high_speed_turning:
    # A closed form rather than a fitted number: Bledt's equation 4.31 places the foot along the resultant of gravity
    # and the centripetal acceleration, displacing it by (z_com / g) * (pdot x omega). With SA01's 0.6124 m CoM that
    # is 0.0624 s^2, the SAME on both axes because the two entries are components of one vector. At the stick limits
    # (0.8 m/s, 1.0 rad/s) it throws the foot 0.050 m outwards - half the Atlas's 0.104 m, and well inside the
    # 0.232 m capture-point clamp.
    forwardPerCrossTerm: 0.0624     # a1 [m s^2/(m rad)] on   v_y * psidot
    forwardOffset: 0.0              # a0 [m]
    lateralPerCrossTerm: 0.0624     # a1 [m s^2/(m rad)] on  -v_x * psidot
    lateralOffset: 0.0              # a0 [m] applied to this foot's own side

  # H_f(Phi) = m*g / (F * beta)  (Table C.1): the vertical stance force reference of a foot that is on the ground for
  # a fraction beta of the gait cycle, because the vertical impulse over the cycle has to add up to the weight.
  #
  # F IS THE NUMBER OF FEET THE ROBOT HAS, a constant - not the number in contact at this instant. The existing
  # reference divides the weight over the feet in contact NOW, so it sums to W at every instant; Bledt's is the same
  # value on every stance foot whatever n_stance is, so its total is below W in single support and above it in double
  # support and averages to exactly W over the cycle, because the mean number of feet on the ground is F * beta.
  # Standing (beta = 1) and a pure alternating single support (beta = 1/2) both give back today's reference exactly,
  # so the correction bites only in a gait that has double support - where it asks the feet to push a little harder
  # than static equilibrium because a single-support phase is coming.
  #
  # Applied as the difference from today's reference, so an empty list is exactly today's behaviour. beta is measured
  # over a fixed window of the MPC horizon's LENGTH, latched once per solve: a re-timable mode schedule has no cycle
  # of its own, and a window that shrank as the node index grew would make beta depend on where in the horizon it is
  # asked. Purely vertical, which is what keeps the cheap yaw-invariant input-frame path valid.
  impulse_scaling:
    scale: 1.0                      # blends between today's reference (0) and Bledt's W/(F*beta) (1); must be >= 0
    # 0.3 sits just below the smallest duty factor any shipped gait produces: `run` (gait.yaml: LF 0.3 s, FLY 0.1 s,
    # RF 0.3 s, FLY 0.1 s) puts each foot down for 0.3 of a 0.8 s stride, i.e. beta = 0.375. So the clamp never binds
    # on a gait this robot actually walks with, and still bounds W / (F beta) at 541 N per foot if one ever does.
    minimumDutyFactor: 0.3          # beta is clamped up to this; 1/beta is unbounded as a flight phase opens
    # The binding case among the shipped gaits is `walk`, whose double support runs at beta = 0.571 against a W/2
    # baseline and therefore asks for 1.75 x weight compensation. (`trot` has no double support, so there beta = 0.5
    # and the correction is identically zero.)
    maximumForceRatio: 2.0          # the reference is clamped to this many times weight compensation

  # H_f(Theta x pdot) = m * omega x pdot  (Table C.1): the horizontal force that holds the robot on a circular path,
  # shared over the stance feet. The companion of high_speed_turning - one says where to put the foot for a fast
  # turn, the other which way to push once it is there.
  #
  # TWO THINGS TO KNOW BEFORE LISTING IT. First, it is the only heuristic of the ten whose force is HORIZONTAL, so
  # under useContactBasisVectorInputs: true the reference has to be rotated into the local contact frame and the
  # whole contact-force reference starts paying a forward-kinematics pass per shooting node per SQP iteration. The
  # layer switches to that path by itself and warns; watch the solve time. Second, and more important: this may be
  # the wrong thing to want HERE. Bledt's control model is a single rigid body whose force reference is the only
  # thing telling the QP how hard to push, whereas these dynamics are full centroidal and the state cost already
  # tracks the commanded linear and angular momentum - so m*omega x v is the derivative of a momentum this problem
  # already regulates, an output the optimizer must produce rather than information the reference lacks. It is
  # implemented because it is one of Bledt's ten and the seam is clean; `scale` is the knob for finding out in
  # simulation whether it earns its place.
  centripetal_acceleration:
    scale: 1.0                      # scales m * omega x v; 0 disables it
    maximumForce: 0.0               # [N] per-foot clamp; 0 uses maximumForceRatioOfWeight instead
    # 0.2 of the 324.8 N body weight is 65 N per foot, which is 40% of the friction budget a single stance foot has at
    # this file's frictionCoefficient of 0.5 - so the reference stays inside the cone the wrench-cone barrier is
    # enforcing rather than fighting it. For scale, the largest centripetal force SA01 can legitimately need is
    # m * v * psidot = 33.1 * 0.8 * 1.0 = 26 N, i.e. 0.08 of body weight, so this clamp does not bind in normal use.
    maximumForceRatioOfWeight: 0.2  # the clamp as a fraction of body weight
# LINT.ThenChange(//humanoid_nmpc/humanoid_common_mpc/src/locomotion_heuristics/LocomotionHeuristicConfig.cpp:locomotion_heuristic_keys)

useGravityCompFeedforward: false
# [s] Hand-over into the MPC from JOINT_PD / GRAVITY_COMP. 0 switches in one control cycle, which is the long-standing
# behaviour and what SA01 starts on. > 0 holds the previous mode's action until the first policy solved after the
# entry reset is active and then ramps targets, gains and feedforward torques into the MPC action over this duration.
# Try 0.3 to 0.5 once the robot stands in MuJoCo.
mpcEntryBlendTime: 0.0

# SAFETY mode: time constant [s] of the exponential decay applied to both joint PD gains once SAFETY is entered. The
# robot holds the posture it had at entry with torque alpha * (kp * (q_hold - q) - kd * qd), alpha = exp(-t / tau), and
# is commanded true zero torque once alpha falls below 2%, i.e. after about 4 * tau seconds.
safetyDecayTimeConstant: 0.5
# Touch-down shaping of the planned contact wrenches in the inverse dynamics of the MRT joint controller. Both at 0
# apply the planned wrench in full from the first control cycle of measured contact, i.e. as a step at the first heel
# or toe strike. debounceTime: measured contact must persist this long before the wrench is applied. rampTime: the
# wrench then rises linearly from zero to the planned value over this time. Lift-off is never shaped.
# Hot-reloadable (GUI: Solver & Horizon).
contact_wrench_gate:
  debounceTime: 0.0  # [s]
  rampTime: 0.0  # [s]

interface:
  verbose: true  # show the loaded parameters
  useAnalyticalGradientsDynamics: false
  useAnalyticalGradientsConstraints: false

model_settings:
  robotName: engineai_sa01

  # LINT.IfChange(foot_constraint_section)
  foot_constraint:
    # Swing: the only regulation of the swing-foot height is the normal-velocity constraint
    # zdot = zdot_ref + positionErrorGain_z * (z_ref - z). The remaining gains act on the stance (zero-velocity)
    # constraint only. These are R1's values.
    positionErrorGain_z: 5.0
    orientationErrorGain: 20.0
    linearVelocityErrorGain_z: 1.0
    linearVelocityErrorGain_xy: 1.0
    angularVelocityErrorGain: 1.0
    linearAccelerationErrorGain_z: 0.0
    linearAccelerationErrorGain_xy: 0.0
    angularAccelerationErrorGain: 0.0
    softConstraintWeight: 250
    # Weight of the SOFT `normal_velocity` term, read only when it is listed in soft_constraints (the
    # contact-implicit formulation). The residual is the same row the hard constraint imposes, so this one number
    # buys the swing-foot vertical servo as a cost the solver can trade off instead of an equality it cannot.
    normalVelocitySoftConstraintWeight: 500
    constrainOrientation: true
    # The orientation error to the ground plane only measures the tilt of the foot normal, so with
    # constrainOrientation the last row of the 6D stance constraint is identically zero and the foot may pivot about
    # the contact normal. Enabling this fills that row with the yaw rate about the contact normal, which removes one
    # input degree of freedom per stance foot. Atlas turns it on together with the contact planner's ACoM dynamics;
    # SA01 runs neither, so it stays off until yaw behaviour has been looked at in MuJoCo.
    constrainYawRateAboutContactNormal: false
  # LINT.ThenChange(//humanoid_nmpc/humanoid_centroidal_mpc/src/mrt/MpcParameterUpdaterModule.cpp:softConstraintWeight_yaml_path)

  phaseTransitionStanceTime: 0.0

  verboseCppAd: true
  recompileLibrariesCppAd: false
  modelFolderCppAd: build/centroidal_mpc_cppad_autocode_gen

  # Exclude these joints from MPC model. SA01 has twelve joints and the MPC uses all of them.
  fixedJointNames: []

  # Pinocchio Frame names for the contact frames
  contactNames6DoF:
    - foot_l_contact
    - foot_r_contact

  # The Parent frames on which the contact frames are added. leg_?6_joint is the ankle ROLL joint, whose origin
  # coincides with the ankle pitch joint, so contacts.contact_frame_translation below is measured from there.
  contactParentJointNames:
    - leg_l6_joint
    - leg_r6_joint

  # armJointNames is deliberately absent: SA01 has no arms, so there is no procedural arm swing to configure.
  # ModelSettings treats the whole block as optional and leaves the swing disabled (hasArmSwingJoints false); naming
  # only some of the four, or naming a joint that is not in the MPC model, still fails loudly at load time.

# The height reference is tracked at foot_*_contact, the CENTRE of the sole. SA01's toe is 0.125 m ahead of it - the
# longest foot relative to its leg of any robot here (0.27 m of sole on a 0.725 m leg) - so the toe height is not
# regulated by anything here and one degree of foot droop drops the toe 2.2 mm.
swing_trajectory_config:
  liftOffVelocity: 0.05
  # A zero touch-down velocity makes the descent flatten out asymptotically, so the sole hovers within a few
  # millimetres of the ground for the last stretch of the swing while the foot is still translating forward. Landing
  # with a real descent rate shortens that window (negative is downward; liftOffVelocity is +0.05 upward).
  touchDownVelocity: -0.05
  # 0.08 m is 11.0% of SA01's 0.725 m leg, inside the 9.1-12.6% band Atlas, G1 and R1 span at the same 0.08. Do not
  # go below 0.06: SA01's long foot needs the clearance more than they do, not less.
  swingHeight: 0.08
  touchDownHeightOffset: 0.0
  # Swings shorter than this are scaled down in height AND velocity by swingDuration / swingTimeScale
  # (SwingTrajectoryPlanner::swingTrajectoryScaling), so it must stay at or below the shortest swing the gait
  # schedule (humanoid_common_mpc/config/command/gait.yaml) or the contact planner can produce. It is tied to
  # contact_planning.yaml's gait_limits.minSwingDuration and hlip.sspDuration, both 0.22 s: raising the cadence
  # without lowering this silently shrinks the foot clearance.
  # LINT.IfChange(sa01_swing_time_scale)
  swingTimeScale: 0.22
  # LINT.ThenChange(//robot_models/engineai_sa01/engineai_sa01_centroidal_mpc/config/mpc/contact_planning.yaml:sa01_gait_cadence)
  impactProximityFactorLiftOffVelocity: -0.15
  impactProximityFactorTouchDownVelocity: 0.3
  impactProximityFactorMidPointValue: 0.0

  # Toe-up pitch of the swing foot reference, tilting the plane that task_space_foot_cost_weights.orientation_x / _y
  # track. It raises the toe by 0.125 * sin(angle) without lowering the sole centre: 0.08 rad buys 10.0 mm.
  # Off by default (0.0 reproduces a flat-foot reference exactly). Enable it only if the toe catches, and start
  # around 0.08. Watch that the heel does not strike first - the contact model assumes a flat landing.
  swingPitchAngle: 0.0
  swingPitchRiseFraction: 0.25
  swingPitchFallFraction: 0.15

# multiple_shooting settings. SA01's problem is the smallest in the repository (24 states, 24 inputs against Atlas's
# 36/36), so four threads at 80 Hz is comfortable.
multiple_shooting:
  nThreads: 4
  dt: 0.02
  sqpIteration: 1
  deltaTol: 1.0e-4
  g_max: 1.0e-2
  g_min: 1.0e-6
  inequalityConstraintMu: 0.1
  inequalityConstraintDelta: 5.0
  projectStateInputEqualityConstraints: true
  printSolverStatistics: true
  printSolverStatus: false
  printLinesearch: false
  useFeedbackPolicy: true
  integratorType: RK4
  threadPriority: 50

# Rollout settings
rollout:
  AbsTolODE: 5.0e-5
  RelTolODE: 5.0e-3
  timeStep: 0.015
  integratorType: ODE45
  maxNumStepsPerSecond: 10000
  checkNumericalStability: false

mpc:
  timeHorizon: 1.0  # [s] about two strides of the default walk
  solutionTimeWindow: -1  # maximum [s]
  coldStart: false

  debugPrint: false

  mpcDesiredFrequency: 80  # [Hz]
  mrtDesiredFrequency: 100  # [Hz]

# The nominal standing state. The joint block must stay equal to reference.yaml's defaultJointState and (8,0) to its
# defaultBaseHeight, which is also the MuJoCo spawn height in zq_sa01.xml.
initialState:
  # ; Normalized Centroidal Momentum: [linear, angular] ;;
  "(0,0)": 0.0  # h_com_x / robotMass
  "(1,0)": 0.0  # h_com_y / robotMass
  "(2,0)": 0.0  # h_com_z / robotMass
  "(3,0)": 0.0  # L_x / robotMass
  "(4,0)": 0.0  # L_y / robotMass
  "(5,0)": 0.0  # L_z / robotMass

  # ; Base Pose: [position, orientation] ;;
  "(6,0)": 0.0  # p_base_x
  "(7,0)": 0.0  # p_base_y
  "(8,0)": 0.8135  # p_base_z
  "(9,0)": 0.0  # theta_base_z
  "(10,0)": 0.0  # theta_base_y
  "(11,0)": 0.0  # theta_base_x

  # ; Joint Positions: ;;
  "(12,0)": 0.0    # leg_l1_joint - left hip roll
  "(13,0)": 0.0    # leg_l2_joint - left hip yaw
  "(14,0)": -0.30  # leg_l3_joint - left hip pitch
  "(15,0)": 0.70   # leg_l4_joint - left knee
  "(16,0)": -0.40  # leg_l5_joint - left ankle pitch
  "(17,0)": 0.0    # leg_l6_joint - left ankle roll
  "(18,0)": 0.0    # leg_r1_joint - right hip roll
  "(19,0)": 0.0    # leg_r2_joint - right hip yaw
  "(20,0)": -0.30  # leg_r3_joint - right hip pitch
  "(21,0)": 0.70   # leg_r4_joint - right knee
  "(22,0)": -0.40  # leg_r5_joint - right ankle pitch
  "(23,0)": 0.0    # leg_r6_joint - right ankle roll

# standard state weight matrix
Q:
  scaling: 1

  # ; Normalized Centroidal Momentum: [linear, angular] ;;
  # The linear entries are the only thing asking the MPC to reach the commanded CoM velocity, so they must stay
  # within an order of magnitude of the largest joint entry below or under-striding becomes the cheap option.
  "(0,0)": 15.0  # h_com_x / robotMass
  "(1,1)": 15.0  # h_com_y / robotMass
  "(2,2)": 15.0  # h_com_z / robotMass
  "(3,3)": 15.0  # L_x / robotMass
  "(4,4)": 40.0  # L_y / robotMass
  "(5,5)": 4.0  # L_z / robotMass

  # ; Base Pose: [position, orientation] ;;
  # Live, because useComAndAcomTracking is false. Roll is weighted hardest: with only 0.150 m between the hips SA01
  # has less lateral base motion available than any other robot here before a foot has to move.
  "(6,6)": 20.0  # p_base_x
  "(7,7)": 20.0  # p_base_y
  "(8,8)": 30.0  # p_base_z
  # euler angles for base to world rotation
  "(9,9)": 0.0  # theta_base_z
  "(10,10)": 5.0  # theta_base_y
  "(11,11)": 85.0  # theta_base_x

  # ; Joint Positions ;;
  # Hip roll and hip yaw are regularised, the sagittal chain is left almost free so the leg can stride. Keep hip roll
  # low: its nominal is 0, i.e. legs vertical in the frontal plane, so a large weight here directly opposes the
  # lateral pelvis shift that unloads the swing foot. Self-collision is enforced by collision_constraint, not by this.
  "(12,12)": 1.25  # leg_l1_joint - left hip roll
  "(13,13)": 4.0   # leg_l2_joint - left hip yaw
  "(14,14)": 0.02  # leg_l3_joint - left hip pitch
  "(15,15)": 0.02  # leg_l4_joint - left knee
  "(16,16)": 0.01  # leg_l5_joint - left ankle pitch
  "(17,17)": 0.01  # leg_l6_joint - left ankle roll
  "(18,18)": 1.25  # leg_r1_joint - right hip roll
  "(19,19)": 4.0   # leg_r2_joint - right hip yaw
  "(20,20)": 0.02  # leg_r3_joint - right hip pitch
  "(21,21)": 0.02  # leg_r4_joint - right knee
  "(22,22)": 0.01  # leg_r5_joint - right ankle pitch
  "(23,23)": 0.01  # leg_r6_joint - right ankle roll

# control weight matrix
R:
  scaling: 0.01

  # ; Feet Contact Forces: [LF, RF] ;;
  "(0,0)": 0.05  # left_force_x
  "(1,1)": 0.05  # left_force_y
  "(2,2)": 0.01  # left_force_z
  "(3,3)": 0.05  # left_moment_x
  "(4,4)": 0.05  # left_moment_y
  "(5,5)": 0.2   # left_moment_z
  "(6,6)": 0.05  # right_force_x
  "(7,7)": 0.05  # right_force_y
  "(8,8)": 0.01  # right_force_z
  "(9,9)": 0.05  # right_moment_x
  "(10,10)": 0.05  # right_moment_y
  "(11,11)": 0.2   # right_moment_z

  # ; Joint Velocities ;;
  # Hip yaw is held an order of magnitude stiffer than the rest: it is the one leg degree of freedom the gait does
  # not need and the one that scuffs the foot when it moves.
  "(12,12)": 20.0   # leg_l1_joint - left hip roll
  "(13,13)": 200.0  # leg_l2_joint - left hip yaw
  "(14,14)": 10.0   # leg_l3_joint - left hip pitch
  "(15,15)": 10.0   # leg_l4_joint - left knee
  "(16,16)": 20.0   # leg_l5_joint - left ankle pitch
  "(17,17)": 20.0   # leg_l6_joint - left ankle roll
  "(18,18)": 20.0   # leg_r1_joint - right hip roll
  "(19,19)": 200.0  # leg_r2_joint - right hip yaw
  "(20,20)": 10.0   # leg_r3_joint - right hip pitch
  "(21,21)": 10.0   # leg_r4_joint - right knee
  "(22,22)": 20.0   # leg_r5_joint - right ankle pitch
  "(23,23)": 20.0   # leg_r6_joint - right ankle roll

# DCM (capture point) terminal cost, active when useDcmTerminalCost is true (it then replaces terminal_cost /
# Q_final). At the end of the horizon the DCM  xi = p_com + v_com / omega  (omega = sqrt(g / comHeight)) is pulled
# towards the centre of the terminal support plus velocityOffsetFactor * v_cmd / omega, so that the horizon ends in a
# capturable state consistent with the commanded walking speed.
# LINT.IfChange(dcm_terminal_cost_config)
dcm_terminal_cost:
  # The true CoM height above the sole in the nominal standing pose, measured with MuJoCo on zq_sa01.xml: the CoM
  # sits 0.201 m below base_link, so 0.8135 - 0.2011 = 0.6124. omega = sqrt(9.81 / 0.6124) = 4.00 rad/s.
  comHeight: 0.6124  # [m]
  gravity: 9.81      # [m/s^2]
  # Scaled from Atlas's 400 by the mass ratio (33.11 / 159.70): the cost is quadratic in a position error in metres,
  # so it has to be commensurate with the robot's weight to trade off against the same Q.
  weight_x: 85  # weight on the longitudinal DCM error
  weight_y: 85  # weight on the lateral DCM error
  velocityOffsetFactor: 0  # 0..1, scales the v_cmd / omega offset of the DCM reference
  supportBlendTime: 0.1    # [s] support weights ramp through lift-off / touch-down so the reference never jumps
# LINT.ThenChange(//humanoid_nmpc/humanoid_centroidal_mpc/src/cost/DcmTerminalCost.cpp:dcm_terminal_cost_keys)

# Quadratic terminal cost on the full state (terminal_cost). Ignored while useDcmTerminalCost is true.
terminalCostScaling: 3
Q_final:
  scaling: 1

  # ; Normalized Centroidal Momentum: [linear, angular] ;;
  "(0,0)": 15.0  # h_com_x / robotMass
  "(1,1)": 15.0  # h_com_y / robotMass
  "(2,2)": 15.0  # h_com_z / robotMass
  "(3,3)": 15.0  # L_x / robotMass
  "(4,4)": 40.0  # L_y / robotMass
  "(5,5)": 4.0  # L_z / robotMass

  # ; Base Pose: [position, orientation] ;;
  # The horizontal position is free at the terminal node - pinning where the base ends up fights the gait - while
  # height and roll stay regulated.
  "(6,6)": 0.0  # p_base_x
  "(7,7)": 0.0  # p_base_y
  "(8,8)": 30.0  # p_base_z
  # euler angles for base to world rotation
  "(9,9)": 0.0  # theta_base_z
  "(10,10)": 5.0  # theta_base_y
  "(11,11)": 85.0  # theta_base_x

  # ; Joint Positions ;;
  "(12,12)": 1.25  # leg_l1_joint - left hip roll
  "(13,13)": 4.0   # leg_l2_joint - left hip yaw
  "(14,14)": 0.02  # leg_l3_joint - left hip pitch
  "(15,15)": 0.02  # leg_l4_joint - left knee
  "(16,16)": 0.01  # leg_l5_joint - left ankle pitch
  "(17,17)": 0.01  # leg_l6_joint - left ankle roll
  "(18,18)": 1.25  # leg_r1_joint - right hip roll
  "(19,19)": 4.0   # leg_r2_joint - right hip yaw
  "(20,20)": 0.02  # leg_r3_joint - right hip pitch
  "(21,21)": 0.02  # leg_r4_joint - right knee
  "(22,22)": 0.01  # leg_r5_joint - right ankle pitch
  "(23,23)": 0.01  # leg_r6_joint - right ankle roll

icp_cost_weights:
  icpErrorWeight: 0.0

task_space_foot_cost_weights:
  activeInStance: false
  # pos_x / pos_y weigh the swing foot against wherever it is being told to land, and are switched off inside the
  # cost when nothing supplies a horizontal target - which is the case here, because useContactPlanning is false and
  # nominal_foothold.stepWidth is 0. They are written as 0 so that turning either of those on is a deliberate act.
  pos_x: 0.0
  pos_y: 0.0
  # 0 because the swing height is imposed exactly by the HARD normal_velocity constraint; nothing is left for a cost
  # to shape. It only becomes load-bearing in the contact-implicit formulation, where normal_velocity moves to
  # soft_constraints.
  pos_z: 0.0
  # This is the only thing holding the swing foot level, and it matters more on SA01 than on any other robot here:
  # its toe is 0.125 m ahead of the contact frame, so a degree of droop drops the toe 2.2 mm - more than Atlas's
  # 2.1 mm on a leg 0.15 m shorter. 1000 is G1's and R1's value.
  orientation_x: 1000.0
  orientation_y: 1000.0
  orientation_z: 0.0
  lin_velocity_x: 10.0
  lin_velocity_y: 10.0
  lin_velocity_z: 0.0
  ang_velocity_x: 1.0
  ang_velocity_y: 1.0
  ang_velocity_z: 0.005
  lin_acceleration_x: 0.0
  lin_acceleration_y: 0.0
  lin_acceleration_z: 0.0
  ang_acceleration_x: 0.0
  ang_acceleration_y: 0.0
  ang_acceleration_z: 0.0

left_leg_torque_cost:
  activeJointNames:
    - leg_l1_joint
    - leg_l2_joint
    - leg_l3_joint
    - leg_l4_joint
    - leg_l5_joint
    - leg_l6_joint

  weights:
    scaling: 1.0e-4

    "(0,0)": 2.0  # leg_l1_joint - left hip roll
    "(1,0)": 1.0  # leg_l2_joint - left hip yaw
    "(2,0)": 2.0  # leg_l3_joint - left hip pitch
    "(3,0)": 8.0  # leg_l4_joint - left knee
    # The ankle entries are 5x R1's 0.2. SA01's ankle actuators are 24 N.m against R1's 50 N.m while the robot is
    # 15% heavier, so ankle torque is the scarcest resource on this machine and the cost has to say so. Scaled by the
    # ratio of the squared torque limits, (50/24)^2 = 4.3.
    "(4,0)": 1.0  # leg_l5_joint - left ankle pitch
    "(5,0)": 1.0  # leg_l6_joint - left ankle roll

right_leg_torque_cost:
  activeJointNames:
    - leg_r1_joint
    - leg_r2_joint
    - leg_r3_joint
    - leg_r4_joint
    - leg_r5_joint
    - leg_r6_joint

  weights:
    scaling: 1.0e-4

    "(0,0)": 2.0  # leg_r1_joint - right hip roll
    "(1,0)": 1.0  # leg_r2_joint - right hip yaw
    "(2,0)": 2.0  # leg_r3_joint - right hip pitch
    "(3,0)": 8.0  # leg_r4_joint - right knee
    "(4,0)": 1.0  # leg_r5_joint - right ankle pitch
    "(5,0)": 1.0  # leg_r6_joint - right ankle roll

contacts:
  contact_frame_translation:
    # ; Translation vector from parent joint to contact frame (center of foot support polygon) ;;
    # From leg_?6_joint (ankle roll, coincident with ankle pitch) to the centre of the sole. The four contact spheres
    # of zq_sa01.xml sit at ankle-frame x = -0.065 / +0.185 with radius 0.010 at z = -0.045, so the sole plane is
    # 0.055 below the ankle and its centre is 0.060 ahead of it.
    # y is 0 even though each sole is 5 mm outboard of its ankle: ContactCenterPoint reads one shared translation for
    # both feet, so the mirrored offset cannot be expressed and is absorbed into the rectangle below.
    x: 0.06
    y: 0.0
    z: -0.055
  contact_rectangle:
    # ; length specified in contact frame ;;
    # The geometric support polygon is x in [-0.125, +0.125], y in [-0.035, +0.035] about the frame above (the y
    # bounds are the rectangle inscribed in BOTH soles, each of which spans -0.035..+0.045 or -0.045..+0.035 because
    # of the 5 mm outboard offset).
    #
    # x_max is NOT the geometric +0.125. SA01's ankle pitch actuator is 24 N.m and the robot weighs 324.8 N, so in
    # SINGLE support the ankle can only hold the centre of pressure within 24 / 324.8 = 0.074 m of the ankle joint,
    # i.e. contact-frame x in [-0.134, +0.014]; in double support, with half the weight per foot, the budget doubles
    # to +-0.148 m and x_max becomes +0.088. Nothing in the MPC knows about ankle torque limits - the wrench cone
    # bounds the centre of pressure geometrically only - so a geometric x_max of +0.125 would let the solver plan a
    # forward CoP the ankle physically cannot hold and SA01 would pitch over its toes. 0.09 is the double-support
    # budget, which is the regime in which the forward CoP is actually used, during weight transfer.
    #
    # If the 24 N.m in the URDF turns out to be a motor-side figure ahead of a reduction, raise this to the geometric
    # 0.125 and delete this note. If SA01 still pitches forward in single support, lower it towards +0.014.
    # The heel side needs no such cap: the geometric -0.125 is already inside the -0.134 the ankle can hold.
    # Laterally the ankle roll actuator is the same 24 N.m, giving a +-0.074 m budget against a +-0.035 rectangle,
    # so the y bounds are purely geometric.
    x_max: 0.09
    x_min: -0.125
    y_max: 0.035
    y_min: -0.035

  contactWrenchConeSoftConstraint:
    # With useContactBasisVectorInputs: true these same values build the wrench-cone generators, so the friction, CoP
    # and torsional limits are enforced structurally and this soft constraint is skipped. minNormalForce and
    # gripperForce are then NOT enforced: a conic combination is homogeneous and cannot represent an affine offset of
    # the cone. The interface logs a warning when they are non-zero.
    # 0.5 against the 1.0 the MuJoCo floor actually provides (zq_sa01.xml), so the plan stays inside what the ground
    # can deliver.
    frictionCoefficient: 0.5
    torsionalFrictionCoefficient: 0.05
    minNormalForce: 5
    gripperForce: 0
    numBasisVectors: 4          # friction pyramid facets; the basis spans exactly the same polyhedral friction cone
    # relaxed log barrier parameters
    mu: 0.2
    delta: 5

  # Barrier penalty enforcing lambda >= 0 for basis-vector contact inputs.
  # Only active when useContactBasisVectorInputs: true.
  # LINT.IfChange(basis_barrier_config)
  basisNonNegativityBarrier:
    mu: 0.01
    delta: 0.001
  # LINT.ThenChange(//humanoid_nmpc/humanoid_centroidal_mpc/src/CentroidalMpcInterface.cpp:basis_barrier_yaml_path)

  # Quadratic regularization on the basis-vector scalings lambda (only active when useContactBasisVectorInputs is
  # true). Each foot has more generators than wrench components, so the transformed input Hessian is singular and
  # this makes it positive definite. Keep it small relative to the R force weights.
  # LINT.IfChange(basis_regularization_config)
  basisScalingRegularization: 0.0001
  # LINT.ThenChange(//humanoid_nmpc/humanoid_centroidal_mpc/src/CentroidalMpcInterface.cpp:basis_regularization_yaml_path)

  # Read only when friction_force_cone / contact_moment_xy are listed in soft_constraints instead of the combined
  # contact_wrench_cone above.
  frictionForceConeSoftConstraint:
    frictionCoefficient: 0.5
    # relaxed log barrier parameters
    mu: 0.2
    delta: 5.0

  contactMomentXYSoftConstraint:
    # relaxed log barrier parameters
    mu: 0.6
    delta: 0.03

jointLimits:
  # relaxed log barrier parameters. delta is 0.1 rad, so the barrier starts paying 0.1 rad before a limit: the knee's
  # 0.0 rad lower bound is 0.70 rad away at the nominal crouch, and the ankle pitch's -1.0 rad bound 0.60 rad away.
  mu: 1200.0
  delta: 0.1

collision_constraint:
  foot:
    leftAnkleFrame: leg_l6_joint
    rightAnkleFrame: leg_r6_joint

    # The constraint keeps the two contact frames 2 * radius apart. SA01's ankles are 0.1503 m apart at the nominal
    # stance. The MuJoCo contact spheres nearest the centreline sit 0.035 m inboard of each ankle with a 0.010 m
    # radius, so the feet physically touch once the ankles close to 0.1503 - 0.0802 + 0.020 = 0.0901 m.
    # 0.045 puts the bound at exactly 0.090 m, i.e. the constraint engages essentially where the feet really meet -
    # there is no margin beyond it, which is what SA01's 0.150 m hip spacing allows and no more. It cannot simply be
    # raised: the relaxed barrier is 0.05 m wide (delta below), so a radius above 0.050 would have the term pushing
    # the feet apart while the robot merely stands at its 0.1503 m nominal stance.
    footCollisionSphereRadius: 0.045
  knee:
    leftKneeFrame: leg_l4_joint
    rightKneeFrame: leg_r4_joint

    # Same reasoning: the knees are 0.150 m apart at the nominal stance and the 0.04 m thigh capsules of zq_sa01.xml
    # touch at 0.080 m.
    kneeCollisionSphereRadius: 0.045
  # relaxed log barrier parameters
  mu: 30000
  delta: 0.05
