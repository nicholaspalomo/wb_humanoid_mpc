targetDisplacementVelocity: 0.5
targetRotationVelocity: 0.5

maxDisplacementVelocityX: 1.2
# Sideways travel is bounded by geometry, not by the leg: with an alternating gait each foot must move v_y * T_stride
# per stride, so the foot separation swings through exactly that excursion, and contact_planning.yaml's foot_separation
# confines it to maxStepWidth - minStepWidth = 0.45 - 0.15 = 0.30 m at every node. At the stride floor
# T_stride = 2 * minSwingDuration = 0.8 s the gait can therefore deliver 0.30 / 0.8 = 0.375 m/s, and it tracks exactly
# only up to 2 * (nominalStepWidth - minStepWidth) / T_stride = 0.25 m/s before the separation starts hitting a bound.
# Above that the planner under-tracks rather than violating the bound, and nothing feeds the shortfall back to the
# whole-body MPC, whose CoM reference keeps following the raw command - the body then walks out from over the feet.
# At 0.8 the stick could ask for more than twice what the gait delivers, which is what produced the sideways falls.
# The forward axis needs no such cap: its budget is 2 * maxStepLength / T_stride, far above the 1.2 stick.
# LINT.IfChange(lateral_velocity_limit)
maxDisplacementVelocityY: 0.25
# LINT.ThenChange(//robot_models/drc_atlas/drc_atlas_centroidal_mpc/config/mpc/contact_planning.yaml:contact_planning_config)
maxDeltaPelvisHeight: 0.4
maxRotationVelocity: 1.0
# Acceleration limits of the velocity reference the MPC target and the contact planner follow (0 = off, an unramped
# reference). A stick jump becomes a ramp, so the planner lengthens the steps progressively instead of answering a step
# change in the command with short quick steps.
maxLinearAcceleration: 1.0    # [m/s^2] 0 to 1.6 m/s in 1.6 s, about two strides
maxAngularAcceleration: 2.0   # [rad/s^2]
targetJointStateInterpolationTimeConstant: 2.0

defaultBaseHeight: 0.8952

defaultJointState:
  "(0,0)": 0.0  # back_bkz
  "(1,0)": 0.0  # back_bky
  "(2,0)": 0.0  # back_bkx
  "(3,0)": 0.3  # l_arm_shz
  "(4,0)": -1.2  # l_arm_shx
  "(5,0)": 2.2  # l_arm_ely
  "(6,0)": 0.55  # l_arm_elx
  "(7,0)": 0.0  # neck_ry
  "(8,0)": -0.3  # r_arm_shz
  "(9,0)": 1.2  # r_arm_shx
  "(10,0)": 2.2  # r_arm_ely
  "(11,0)": -0.55  # r_arm_elx
  "(12,0)": 0.0  # l_leg_hpz
  "(13,0)": 0.0  # l_leg_hpx
  "(14,0)": -0.42  # l_leg_hpy
  "(15,0)": 0.84  # l_leg_kny
  "(16,0)": -0.42  # l_leg_aky
  "(17,0)": 0.0  # l_leg_akx
  "(18,0)": 0.0  # r_leg_hpz
  "(19,0)": 0.0  # r_leg_hpx
  "(20,0)": -0.42  # r_leg_hpy
  "(21,0)": 0.84  # r_leg_kny
  "(22,0)": -0.42  # r_leg_aky
  "(23,0)": 0.0  # r_leg_akx

initialModeSchedule:
  modeSequence:
    - STANCE
    - STANCE
  eventTimes:
    - 0.5

defaultModeSequenceTemplate:
  modeSequence:
    - STANCE
  switchingTimes:
    - 0.0
    - 0.5

