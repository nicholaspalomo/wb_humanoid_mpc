# Unitree R1 (26-DoF) Joint Proportional and Derivative (PD) Controller Gains
# Units: Kp in [N*m/rad], Kd in [N*m*s/rad]

default_gains:
  kp: 120.0
  kd: 7.0

joint_gains:
  # Left Leg
  left_hip_pitch_joint:
    kp: 120.0
    kd: 8.0
  left_hip_roll_joint:
    kp: 120.0
    kd: 8.0
  left_hip_yaw_joint:
    kp: 120.0
    kd: 8.0
  left_knee_joint:
    kp: 160.0
    kd: 10.0
  left_ankle_pitch_joint:
    kp: 60.0
    kd: 5.0
  left_ankle_roll_joint:
    kp: 60.0
    kd: 5.0

  # Right Leg
  right_hip_pitch_joint:
    kp: 120.0
    kd: 8.0
  right_hip_roll_joint:
    kp: 120.0
    kd: 8.0
  right_hip_yaw_joint:
    kp: 120.0
    kd: 8.0
  right_knee_joint:
    kp: 160.0
    kd: 10.0
  right_ankle_pitch_joint:
    kp: 60.0
    kd: 5.0
  right_ankle_roll_joint:
    kp: 60.0
    kd: 5.0

  # Waist / Torso
  waist_roll_joint:
    kp: 100.0
    kd: 6.0
  waist_yaw_joint:
    kp: 100.0
    kd: 6.0

  # Left Arm
  left_shoulder_pitch_joint:
    kp: 50.0
    kd: 3.5
  left_shoulder_roll_joint:
    kp: 50.0
    kd: 3.5
  left_shoulder_yaw_joint:
    kp: 50.0
    kd: 3.5
  left_elbow_joint:
    kp: 35.0
    kd: 2.5
  left_wrist_roll_joint:
    kp: 15.0
    kd: 1.0

  # Right Arm
  right_shoulder_pitch_joint:
    kp: 50.0
    kd: 3.5
  right_shoulder_roll_joint:
    kp: 50.0
    kd: 3.5
  right_shoulder_yaw_joint:
    kp: 50.0
    kd: 3.5
  right_elbow_joint:
    kp: 35.0
    kd: 2.5
  right_wrist_roll_joint:
    kp: 15.0
    kd: 1.0

  # Head
  head_pitch_joint:
    kp: 20.0
    kd: 1.5
  head_yaw_joint:
    kp: 20.0
    kd: 1.5
