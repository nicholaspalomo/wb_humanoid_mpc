# Unitree R1 (26-DoF) Joint Proportional and Derivative (PD) Controller Gains
# Units: Kp in [N*m/rad], Kd in [N*m*s/rad]
# Based on Unitree SDK2 low-level control specifications:
# - Arm joints use compliant holding gains (Kp: 8-20, Kd: 0.6-1.5) to prevent high-frequency
#   chatter/flailing on low-inertia links (0.3-0.8 kg).
# - Leg joints maintain adequate stiffness for locomotion (Kp: 40-100, Kd: 4-10).

default_gains:
  kp: 60.0
  kd: 6.0

joint_gains:
  # Left Leg
  left_hip_pitch_joint:
    kp: 60.0
    kd: 6.0
  left_hip_roll_joint:
    kp: 60.0
    kd: 6.0
  left_hip_yaw_joint:
    kp: 60.0
    kd: 6.0
  left_knee_joint:
    kp: 100.0
    kd: 10.0
  left_ankle_pitch_joint:
    kp: 40.0
    kd: 4.0
  left_ankle_roll_joint:
    kp: 40.0
    kd: 4.0

  # Right Leg
  right_hip_pitch_joint:
    kp: 60.0
    kd: 6.0
  right_hip_roll_joint:
    kp: 60.0
    kd: 6.0
  right_hip_yaw_joint:
    kp: 60.0
    kd: 6.0
  right_knee_joint:
    kp: 100.0
    kd: 10.0
  right_ankle_pitch_joint:
    kp: 40.0
    kd: 4.0
  right_ankle_roll_joint:
    kp: 40.0
    kd: 4.0

  # Waist / Torso
  waist_roll_joint:
    kp: 60.0
    kd: 6.0
  waist_yaw_joint:
    kp: 60.0
    kd: 6.0

  # Left Arm (Compliant low-level holding gains matching Unitree SDK)
  left_shoulder_pitch_joint:
    kp: 20.0
    kd: 1.5
  left_shoulder_roll_joint:
    kp: 20.0
    kd: 1.5
  left_shoulder_yaw_joint:
    kp: 15.0
    kd: 1.2
  left_elbow_joint:
    kp: 15.0
    kd: 1.0
  left_wrist_roll_joint:
    kp: 8.0
    kd: 0.6

  # Right Arm (Compliant low-level holding gains matching Unitree SDK)
  right_shoulder_pitch_joint:
    kp: 20.0
    kd: 1.5
  right_shoulder_roll_joint:
    kp: 20.0
    kd: 1.5
  right_shoulder_yaw_joint:
    kp: 15.0
    kd: 1.2
  right_elbow_joint:
    kp: 15.0
    kd: 1.0
  right_wrist_roll_joint:
    kp: 8.0
    kd: 0.6

  # Head
  head_pitch_joint:
    kp: 10.0
    kd: 0.8
  head_yaw_joint:
    kp: 10.0
    kd: 0.8
