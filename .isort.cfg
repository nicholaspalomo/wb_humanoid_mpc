[settings]
# Google import order (Python style guide 3.13), wrapped the way black wraps. known_first_party is passed by
# tools/hooks/format_code.py and lint_code.py (-p ...) from the Bazel import roots (tools/hooks/lint_files.py).
profile = google
line_length = 88
multi_line_output = 3
include_trailing_comma = true
use_parentheses = true
ensure_newline_before_comments = true
py_version = 311
