# ==============================================================================
# Simulation override for docker-compose.robot.yaml: the robot side on the laptop, with the MuJoCo viewer
#
#   ROBOT=drc_atlas docker compose -f docker-compose.robot.yaml -f docker-compose.robot.sim.yaml up
#
# `make launch-<robot>-sim` runs it. The image is robot-sim: robot-runtime plus the GL libraries of the viewer, so the
# robot process, its realtime settings and its bus are the robot's. The viewer draws on DISPLAY (the VNC desktop :99,
# or the host's display after `xhost +SI:localuser:root`); the container reaches the X server through its abstract
# socket on the host's network, without a mount. WB_ROBOT_HEADLESS=true turns the viewer off.
#
# One difference from the robot, for tuning: the checkout's robot_models (WB_ROBOT_SIM_MODELS, which session.sh sets to
# the host's path of it) is mounted read-only over the image's copy, so that the robot process reads the files the MPC
# node, the GUI's "Save to YAML" and an editor use, and its watchers reload joint_pd_gains.yaml and the task file's
# controller-side keys (contactEstimator, contact_wrench_gate) live, as the old sims did. On the robot the process
# reads the copy deployed with the image, and the GUI's bus messages (operator/pd_gains, operator/mpc_parameters) are
# what reaches it.
# ==============================================================================

services:
  robot:
    image: ${WB_ROBOT_SIM_IMAGE:-wb-humanoid-robot-sim:latest}
    # A crashed simulation stays down, so its log is the last thing on the screen.
    restart: "no"
    # LINT.IfChange(sim_models_mount)
    volumes:
      - type: bind
        source: ${WB_ROBOT_SIM_MODELS:-./robot_models}
        target: /opt/wb-humanoid-robot/robot_models
        read_only: true
    # LINT.ThenChange(//tools/deploy/session.sh:sim_models, //tools/deploy/test_deploy_files.py:sim_models_mount)
    environment:
      DISPLAY: ${DISPLAY:-:99}
      # Mesa's software renderer: the container has no GPU device. Its threads are not pinned, so they are bounded,
      # lest the viewer take the cores of the MPC on the same machine.
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: llvmpipe
      LP_NUM_THREADS: ${LP_NUM_THREADS:-2}
